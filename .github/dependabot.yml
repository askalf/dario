# Dependabot version-update config.
#
# Security-advisory updates are already on via the repo-level "Dependabot
# security updates" setting (gh api repos/askalf/dario → security_and_
# analysis.dependabot_security_updates) and are independent of this file.
# This file covers *version* updates — catching stale deps before they
# ship a vuln, not after.
#
# Non-major updates are grouped into a single weekly PR per ecosystem to
# keep noise down; majors still open individually so they get real review.
# Schedule is Monday 09:00 UTC — lines up with the start of the workweek
# in US/EU timezones so the PR isn't sitting over a weekend.
#
# Dependabot auto-adds a `dependencies` label; no explicit labels: field
# needed here.

version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    groups:
      non-major:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore
      include: scope

  # Build-side fuzz deps (ClusterFuzzLite; see .clusterfuzzlite/build.sh).
  # Committed lockfile — watched here so vulns like GHSA-r292-9mhp-454m
  # (node-tar) get a version-update PR instead of only surfacing via
  # Scorecard's osv-scanner.
  - package-ecosystem: npm
    directory: /.clusterfuzzlite
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    groups:
      non-major:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore
      include: scope

  # Drift-probe deps — committed lockfile, same rationale as above.
  - package-ecosystem: npm
    directory: /.github/drift-probe-deps
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    groups:
      non-major:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore
      include: scope

  # Base images. Every Dockerfile here is pinned by digest, which is the
  # right call for reproducibility and supply-chain integrity — but a pinned
  # digest is FROZEN, so without something bumping it the base stops
  # receiving security patches and the pin quietly becomes the liability it
  # was meant to prevent. These entries are what make pinning safe rather
  # than merely compliant.
  #
  # One entry per directory containing a Dockerfile; Dependabot does not
  # recurse. Adding a Dockerfile elsewhere means adding it here too, or it
  # is pinned and unwatched.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope

  # Reference deployment for the refresh lock (docs/multi-instance.md).
  # Not built by CI — which makes it MORE worth watching, not less: users
  # copy this file into their own infrastructure.
  - package-ecosystem: docker
    directory: /redis-lock
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope

  # ClusterFuzzLite build image (gcr.io/oss-fuzz-base).
  - package-ecosystem: docker
    directory: /.clusterfuzzlite
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      non-major:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: ci
      include: scope
