name: Bot PR version gate

# Checks the two highest-volume bot-PR shapes before anything merges them:
#   1. Dependabot version-update PRs (weekly, grouped non-major)
#   2. Drift-bot release PRs (bot/cc-drift-*, bot/template-label-*, and
#      bot/template-rebake-* branches — maxTested bumps, label refreshes, and
#      full template re-captures; all gated by the required wire-drift check)
#
# The merge itself belongs to the platform review gate: it squash-merges a
# bot PR once Redline approves and the required checks pass, and a PR that
# bumps package.json waits for the operator. This workflow used to ALSO arm
# GitHub native auto-merge, and the gate disarmed that within seconds on
# every PR (#1431, #1415 twice, #1405 nine times in 17 h): an hourly
# arm/disarm loop with no merge at the end of it. The arming is gone; the
# version-order guard below stays, as the signal on the PR that a bot bump
# is stale.
#
# Safety net: major-version Dependabot PRs are gated out by reading the
# structured update-type from dependabot/fetch-metadata, NOT by string-
# matching the PR title. Earlier title-based gating false-positive'd on
# grouped non-major PRs whose Dependabot-generated title contains the
# literal substring "non-major" (which contains "major"), so they were
# silently skipped instead of auto-merged. update-type from metadata is
# unambiguous: 'version-update:semver-major' vs minor/patch.
#
# Version-order guard (2026-08-12): two bot PRs can independently bump
# package.json to the SAME version, because each is drafted off the current
# release without seeing the other. #954 (cc-drift maxTested) and #955
# (template label refresh) both took 5.5.10 off 5.5.9, with different dates.
# Merging both makes them race, and the loser is whichever merges SECOND:
#
#   - if its version now equals the released one, cc-drift-auto-release's
#     duplicate-tag guard fast-exits green and ships NOTHING — a release that
#     silently did not happen, on a chore PR nobody re-reads after merge;
#   - if it is lower, master's version moves BACKWARDS below a published tag.
#
# So this workflow requires that a PR which changes the package.json version
# carries one strictly GREATER than the base branch tip, and says so on the
# run when it does not. A PR that does not touch package.json (the common
# Dependabot action bump) does not run it. A flagged PR is not broken — it is
# stale, and needs the update it would have needed anyway; the `synchronize`
# trigger re-evaluates it on the next push.
#
# What this workflow does NOT do:
#   - Merge, arm, force-merge or admin-bypass anything
#   - Touch PRs from human contributors (filter is bot-shape only)
#   - Re-trigger CI (relies on native trigger from PR open / push)
#   - Order merges between PRs. It checks a per-PR invariant (version must
#     advance past the tip); correct ordering falls out of that, without this
#     workflow needing to know what other PRs exist.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    # Only a PR that changes package.json can change the version, so only such a PR runs the
    # gate. The bot-shape filter below still applies; without this, every other PR shows the
    # job as a skipped check. The filter reads the whole PR diff, so a later push that adds a
    # package.json change starts the gate.
    paths: [package.json]

permissions:
  contents: read

jobs:
  version-gate:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Broader job-level filter: any dependabot PR OR any cc-drift / template-label
    # / template-rebake bot PR gets the runner. Major-version gating is enforced
    # at step level using structured Dependabot metadata.
    if: |
      github.event.pull_request.user.login == 'dependabot[bot]' ||
      startsWith(github.event.pull_request.head.ref, 'bot/cc-drift-') ||
      startsWith(github.event.pull_request.head.ref, 'bot/template-label-') ||
      startsWith(github.event.pull_request.head.ref, 'bot/template-rebake-')
    steps:
      - name: Fetch Dependabot metadata
        id: dep_meta
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Checks out the BASE branch only (actions/checkout's default ref on
      # pull_request_target), never the PR head. This workflow runs with write
      # scopes and repository secrets, so checking out and executing head code
      # would be the classic fork-PR RCE. Sparse: the one script is the whole
      # need, matching cc-oauth-health.yml.
      - name: Fetch the version-gate script
        uses: askalf/checkout-with-retry@115a6407547e9711edbc2e915838d495cad9583f  # v1.1.0
        with:
          sparse-checkout: scripts/version-advances.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Check the version advances past the base tip
        id: version_gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Read package.json through the contents API rather than from the
          # checkout: the sparse checkout deliberately holds only the script,
          # and the three versions live at three different refs anyway.
          #
          # A read that fails must NOT fail the step. version-advances.sh
          # already fails CLOSED on a missing version — it answers "false,
          # could not read package.json at every ref", which leaves the PR
          # unarmed until the next push (or the hourly sweep) re-runs the gate.
          # That is the right answer for a transient API blip. But `set -e`
          # plus `pipefail` killed the step on the first non-zero `gh api`
          # BEFORE any of that logic ran, turning a blip into a red required
          # check on an otherwise healthy PR (#1202) — with the cause invisible
          # because stderr went to /dev/null and the step died before even the
          # diagnostic echo below. So: keep the errors, retry the transient
          # ones, and hand back an empty version on give-up.
          version_at() {
            local ref="$1" attempt=1 content ver
            while : ; do
              if content=$(gh api "repos/${REPO}/contents/package.json?ref=${ref}" --jq '.content' 2>&1); then
                ver=$(printf '%s' "$content" | base64 -d 2>/dev/null | jq -r '.version // empty') || ver=''
                if [ -n "$ver" ]; then
                  printf '%s' "$ver"
                  return 0
                fi
                echo "version_at(${ref}): attempt ${attempt} read the file but decoded no .version" >&2
              else
                echo "version_at(${ref}): attempt ${attempt} failed: ${content}" >&2
              fi
              if [ "$attempt" -ge 3 ]; then
                break
              fi
              attempt=$((attempt + 1))
              sleep 2
            done
            echo "::warning::version_at(${ref}) gave up after ${attempt} attempts — the gate below will fail closed." >&2
            return 0
          }

          base_ver=$(version_at "$BASE_SHA")     # what this PR branched from
          head_ver=$(version_at "$HEAD_SHA")     # what this PR proposes
          tip_ver=$(version_at "$BASE_REF")      # what is on the base branch NOW

          echo "base(${BASE_SHA:0:8})=${base_ver:-?}  head(${HEAD_SHA:0:8})=${head_ver:-?}  tip(${BASE_REF})=${tip_ver:-?}"

          # The rule itself lives in scripts/version-advances.sh so this path
          # and the hourly sweep cannot drift apart, and so both directions of
          # it stay unit-testable (test/version-advances.mjs).
          # head/tail rather than printf+sed: the script's contract is exactly
          # two lines, and this keeps backslash escapes out of a shell block
          # nested inside YAML, where one mangled \n silently becomes a real
          # newline and breaks the parse.
          verdict=$(sh scripts/version-advances.sh "$base_ver" "$head_ver" "$tip_ver")
          safe=$(echo "$verdict" | head -1)
          reason=$(echo "$verdict" | tail -1)

          echo "safe=$safe" >> "$GITHUB_OUTPUT"
          if [ "$safe" = "true" ]; then
            echo "Version gate: $reason."
          else
            echo "::warning::Version gate — $reason. Update this branch and re-bump above ${tip_ver:-the tip}; the gate re-evaluates on the next push."
          fi

      - name: Report the eligible PR
        # Dependabot path: only when update-type is NOT major.
        # Drift-bot path (cc-drift + template-label + template-rebake): always (no
        # metadata to read; branch name is the gate). Same-repo guard blocks fork
        # spoofing. A template-rebake DOES change wire content (unlike a label
        # refresh), so its safety rests on the required "Wire drift (self-hosted)"
        # check; a rebake that did not match live CC fails that check and the
        # platform gate never merges it. The version gate applies to BOTH paths —
        # a Dependabot PR that bumps package.json is subject to exactly the same
        # ordering hazard.
        if: |
          steps.version_gate.outputs.safe == 'true' &&
          (
            (
              github.event.pull_request.user.login == 'dependabot[bot]' &&
              steps.dep_meta.outputs.update-type != 'version-update:semver-major'
            ) ||
            (
              github.event.pull_request.head.repo.full_name == github.repository &&
              (
                startsWith(github.event.pull_request.head.ref, 'bot/cc-drift-') ||
                startsWith(github.event.pull_request.head.ref, 'bot/template-label-') ||
                startsWith(github.event.pull_request.head.ref, 'bot/template-rebake-')
              )
            )
          )
        env:
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          TITLE: ${{ github.event.pull_request.title }}
          UPDATE_TYPE: ${{ steps.dep_meta.outputs.update-type }}
        run: |
          set -euo pipefail
          echo "PR #${PR} passes the bot-PR version gate"
          echo "  author:      ${AUTHOR}"
          echo "  branch:      ${BRANCH}"
          echo "  title:       ${TITLE}"
          echo "  update_type: ${UPDATE_TYPE:-n/a (cc-drift path)}"
          echo ""
          echo "The platform review gate merges it once Redline approves and the required checks pass."
