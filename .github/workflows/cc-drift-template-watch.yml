name: CC template drift watch (self-hosted)

# Watches for "same-binary remote-config drift" — the class of CC wire-shape
# change documented in v4.2.1's CHANGELOG entry. Runs `capture-and-bake.mjs
# --check` against a live CC install on a self-hosted runner; on detection,
# auto-rebakes the template, pushes to a bot branch, and opens a PR (v4.4.0).
#
# Pairs with `cc-drift-watch.yml` (catches npm-release-level drift, runs on
# github-hosted runner, no auth needed). This workflow catches everything
# the npm-release watcher can't: silent in-version wire changes, system
# prompt edits, beta header additions/removals — all of which arrive via
# Anthropic's CC remote-config and leave the static binary unchanged.
#
# Self-hosted requirement: a runner with @anthropic-ai/claude-code installed
# AND authenticated (~/.claude/.credentials.json or DARIO_CLAUDE_BIN env var).
# Hetzner / DO / EC2 / etc — anything dedicated. Setup: docs/drift-monitor.md.
#
# Runs HOURLY (:41, staggered off the :00 grid) when the runner is online.
# Was */30 until 2026-08-02. Every run is a chance for CC's atomic tmp+rename
# to replace the pinned credential symlink AFTER the pin step below, splitting
# the shared OAuth family and revoking the fleet's token (4th occurrence that
# day; see docs/recovery.md "OAuth credential dead"). Halving the cadence halves
# the collision surface. This is a MITIGATION, not the fix — the real fix is a
# dedicated Max seat for dario so the runner and the container stop sharing one
# refresh-token family. Drift moves at the pace of Anthropic releases, so hourly
# costs very little detection latency. Idempotent: if drift persists
# across cycles AND a bot rebake PR is already open, no new PR is opened.
# The open one is checked against live once it is two hours old, and closed
# when it has drifted. When the template is re-baked + merged, the issue
# auto-closes on the next clean cycle.
#
# v4.4.0 — auto-rebake closes the manual-remediation step in the loop.
# Previously: drift detected → issue opened → maintainer SSHes to a CC-
# installed machine → runs capture-and-bake → commits + opens PR. Now:
# on drift the workflow opens the issue, checks the re-bake against upstream
# and opens a PR with it. The platform review gate merges that PR once the
# review approves it and the upstream check passed on the bundle at its
# head. Without a passing check a maintainer merges.
#
# LABEL-only drift (exit 3): `capture-and-bake --check` also distinguishes the
# case where the live wire shape MATCHES the bundle but the bundled `_version`
# label lags the installed CC version. That's the signal sdk-drift-watch.yml
# raises (it compares `_version` against npm) with nothing to re-bake. This
# workflow ships it as a deterministic label bump (scripts/label-sync.mjs) on
# a bot/template-label-* branch for the platform review gate to merge — safe
# because an empty computeDrift means everything it compares (tool names, base
# betas, system prompt, agent identity, field orders) matches, so only the
# version string moves (same risk class as cc-drift-watch.yml's maxTested
# bump). It is not a byte-identity proof: tool descriptions and schemas are not
# compared, managed betas are filtered and the memory path is normalized.

on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  template-drift-check:
    permissions:
      contents: write       # v4.4.0: push the auto-rebake commit to bot/* branches
      issues: write
      pull-requests: write  # v4.4.0: open the auto-rebake PR
      statuses: write       # the rebake/upstream status on the rebake commit
    # Runs only on the self-hosted runner labeled `dario-drift`. Github-hosted
    # runners don't have CC + OAuth, so this job effectively gates on whether
    # a maintainer has registered a runner with that label.
      # Never from a fork. This job is meaningless anywhere but this
      # repository, and 54 forks inherit the schedule. See #1039.
    if: github.repository == 'askalf/dario'
    runs-on: [self-hosted, dario-drift]
    timeout-minutes: 15
    steps:
      - uses: askalf/checkout-with-retry@115a6407547e9711edbc2e915838d495cad9583f  # v1.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22

      - name: Install + build
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Pin OAuth credential to platform-dario canonical (sole-refresher)
        # The platform dario container is the SOLE refresher of the shared Max
        # OAuth (see the "no refresh from this side" note on the next step). But CC
        # refreshes via atomic tmp+rename, which REPLACES the /root/.claude symlink
        # with a regular file — splitting the shared refresh-token family across two
        # files that then rotate each other to death via Anthropic refresh-token
        # reuse-detection (the 2026-06-23 fleet outage: runner refreshed at 05:37 on
        # a split file, container presented the rotated-away token at 06:00 → whole
        # family invalidated). Re-link to the container's canonical before the
        # Max-OAuth step so the runner reads its always-fresh token and never
        # refreshes here. See docs/recovery.md "OAuth credential dead".
        run: |
          CANON=/var/lib/askalf-dario/credentials.json
          if [ -e "$CANON" ]; then
            mkdir -p /root/.claude /root/.dario
            ln -sfn "$CANON" /root/.claude/.credentials.json
            ln -sfn "$CANON" /root/.dario/credentials.json
            echo "pinned runner OAuth credential -> $CANON (inode $(stat -L -c %i "$CANON"))"
          else
            echo "::warning::canonical $CANON missing — platform dario down? proceeding as-is"
          fi

      - name: Run drift check
        id: check
        # Exit codes from capture-and-bake.mjs --check:
        #   0 — no drift, template matches live capture
        #   1 — infrastructure failure (CC not on PATH, capture timeout, or
        #       the runner's installed CC is OLDER than the bundle's capture —
        #       an older binary re-captures the previous wire shape, so its
        #       "drift" would auto-rebake a template DOWNGRADE (PR #632); fix
        #       is `npm i -g @anthropic-ai/claude-code@latest` on the runner)
        #   2 — drift detected vs current bundled template
        # We want the workflow to keep running through exit 2 so the
        # auto-rebake + issue steps can run; the final `Set job status`
        # step recovers the failure code so the workflow run reflects the
        # actual drift outcome.
        #
        # OAuth credential: shares /root/.claude/.credentials.json with the
        # platform dario container instead of the isolated /root/.claude-runner
        # path the v4.4.1 design used. Reason: the isolated credential
        # had no refresh authority — workflow fires were too sparse to
        # rotate the token before Anthropic's idle-refresh limit kicked
        # in, and recovery required interactive `dario login --manual`.
        # Sharing with the platform credential file lets platform dario's
        # 24/7 auto-refresh loop keep the token fresh; this workflow just
        # reads whatever's current, no refresh from this side. See
        # docs/drift-monitor.md.
        run: |
          set +e
          node scripts/capture-and-bake.mjs --check 2> drift-output.txt
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

          # dario#881 tripwire. capture-and-bake writes issue-881-tripwire.txt
          # only when the scrubbed base capture carries the known +279-char
          # residue. The loud ::warning:: annotation itself rides in
          # drift-output.txt and reaches the run summary via the `cat` below —
          # this just records the hit as a step output so the rebake step can
          # label the PR it opens. 26h of CI data says this has never fired on
          # the runner; if it does, the rebake is #881 residue, not CC drift.
          if [ -f issue-881-tripwire.txt ]; then
            echo "issue_881=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=dario#881::tripwire hit on the --check capture — see the warning annotation and https://github.com/askalf/dario/issues/881"
          else
            echo "issue_881=false" >> "$GITHUB_OUTPUT"
          fi

          if [ $code -eq 0 ]; then
            echo "No drift detected."
            cat drift-output.txt
          elif [ $code -eq 2 ]; then
            echo "DRIFT DETECTED:"
            cat drift-output.txt
          elif [ $code -eq 3 ]; then
            echo "LABEL-ONLY DRIFT (wire shape matches; _version label is stale):"
            cat drift-output.txt
          else
            echo "Infrastructure failure (exit $code):"
            cat drift-output.txt
            exit $code
          fi

      - name: Check the open rebake PR against live
        # A bake is a snapshot, and Claude Code's remote configuration changes
        # without a version change, so an open rebake PR can stop matching
        # live. One older than STALE_AFTER_HOURS is checked against live with
        # its own bundle as the baseline, so that a prompt shape the bundle
        # already knows as an A/B arm is not read as drift.
        #
        # A PR is closed only when two captures in a row report drift and
        # neither is the dario#881 residue: a single capture can be an A/B arm
        # or that residue. Opening a rebake PR takes two captures as well, a
        # check that reports drift and then a bake that differs from the
        # committed bundle.
        #
        # This runs after a check against master that exited 0, 2 or 3. The PR
        # goes stale independently of that check: when live has returned to
        # master's shape it exits 0 and there is nothing to bake, but the PR
        # still carries a shape live no longer sends. Whether a fresh bake
        # follows is the next step's business.
        #
        # Cost: one extra capture pass per run while such a PR is open, and a
        # second when the first reports drift. Each pass spawns Claude Code
        # against the shared credential like the check above.
        id: open_pr
        env:
          GH_TOKEN: ${{ secrets.DARIO_DRIFT_BOT_PAT || secrets.GITHUB_TOKEN }}
          # Younger than this, an open rebake PR is left alone: it is being
          # reviewed, and its capture is recent.
          STALE_AFTER_HOURS: '2'
          MASTER_CHECK: ${{ steps.check.outputs.exit_code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eo pipefail

          # Matched on the branch-name prefix this workflow alone writes to, in
          # this repository: a fork's branch of that name is not ours to close.
          existing_pr=$(gh pr list --state open --search "head:bot/template-rebake-" --json number,headRefName,url,createdAt,isCrossRepository --jq 'map(select(.isCrossRepository | not)) | .[0]' || echo "")
          if [ -z "$existing_pr" ] || [ "$existing_pr" = "null" ]; then
            echo "no open rebake PR"
            echo "state=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          field() { echo "$existing_pr" | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).$1"; }
          pr_url=$(field url)
          pr_number=$(field number)
          pr_branch=$(field headRefName)
          age_hours=$(( ( $(date -u +%s) - $(date -u -d "$(field createdAt)" +%s) ) / 3600 ))

          pr_checks=()
          residue=false
          if [ "$age_hours" -ge "$STALE_AFTER_HOURS" ]; then
            # The check reads the bundle from the working tree, so the PR's
            # bundle is put there for the duration and master's is put back on
            # any exit. The first check's summary belongs to the drift issue,
            # and its label-target.txt is the label-sync step's input. A check
            # of the PR's bundle writes its own of each, so both are set aside
            # meanwhile. The label target is put back as it was, absent when
            # the check against master wrote none.
            git fetch --no-tags --depth=1 origin "$pr_branch"
            git show "FETCH_HEAD:src/cc-template-data.json" > pr-bundle.json
            restore() {
              git checkout -- src/cc-template-data.json
              rm -f pr-bundle.json label-target.txt
              if [ -f drift-summary.keep ]; then mv -f drift-summary.keep drift-summary.md; fi
              if [ -f label-target.keep ]; then mv -f label-target.keep label-target.txt; fi
            }
            trap restore EXIT
            if [ -f drift-summary.md ]; then mv drift-summary.md drift-summary.keep; fi
            if [ -f label-target.txt ]; then mv label-target.txt label-target.keep; fi
            cp pr-bundle.json src/cc-template-data.json
            for attempt in 1 2; do
              rm -f drift-summary.md
              set +e
              node scripts/capture-and-bake.mjs --check 2> "pr-check-output-$attempt.txt"
              code=$?
              set -e
              pr_checks+=("$code")
              if [ -f issue-881-tripwire.txt ]; then residue=true; fi
              if [ -f drift-summary.md ]; then mv -f drift-summary.md pr-check-summary.md; fi
              # A second capture is only worth making to confirm drift.
              if [ "$code" -ne 2 ]; then break; fi
            done
            restore
            trap - EXIT
          fi

          action=$(node scripts/rebake-pr-action.mjs "$age_hours" "$STALE_AFTER_HOURS" "$MASTER_CHECK" "$residue" "${pr_checks[@]}")
          echo "open rebake PR #$pr_number: ${age_hours}h old, checks against its bundle: ${pr_checks[*]:-none}, #881 residue: $residue, check against master: $MASTER_CHECK, action: $action"
          if [ "$action" = "keep" ]; then
            {
              echo "state=open"
              echo "pr_url=$pr_url"
              echo "pr_number=$pr_number"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          stale_comment=$(mktemp)
          {
            if [ "$action" = "replace" ]; then
              echo "Closed by the drift watcher. Two captures in a row no longer match this bundle, so merging it would ship a shape that live has moved on from. Master's bundle does not match live either, so this run bakes again."
            else
              echo "Closed by the drift watcher. Two captures in a row no longer match this bundle, and live matches the bundle on master again, so there is nothing to re-bake."
            fi
            echo ""
            echo "What the check of this PR's bundle against live reported ([run]($RUN_URL)):"
            echo ""
            if [ -f pr-check-summary.md ]; then
              cat pr-check-summary.md
            else
              echo '```'
              grep -hE '^\[bake\] check:' pr-check-output-*.txt | sort -u || true
              echo '```'
            fi
          } > "$stale_comment"
          gh pr comment "$pr_number" --body-file "$stale_comment"
          gh pr close "$pr_number" --delete-branch
          echo "closed stale rebake PR #$pr_number"
          echo "state=closed" >> "$GITHUB_OUTPUT"

      - name: Auto-rebake + open PR
        # On drift detection (exit 2), re-bake the template (real write, not
        # --check), check that upstream accepts requests rebuilt from the new
        # bundle, commit to a bot/template-rebake-* branch, push, and open a PR.
        # Skipped while a rebake PR is open.
        #
        # A PR is opened only with a verdict from the upstream check, pass or
        # fail. When upstream did not judge a request (it refused the borrowed
        # token, rate-limited, failed or did not answer, or the proxy had no
        # seat to send the request with), nothing is opened and the next run
        # bakes and checks again. When the check itself does not work, the
        # job fails.
        if: steps.check.outputs.exit_code == '2'
        id: rebake
        env:
          # v4.6.5: prefer DARIO_DRIFT_BOT_PAT (a fine-grained PAT) over
          # the default GITHUB_TOKEN for the gh CLI ops below. PRs created
          # by GITHUB_TOKEN don't trigger downstream workflows by design,
          # so CI and the review would never run on an auto-rebake PR. With a
          # PAT, GitHub treats PR creation as a regular user action and
          # `pull_request:` workflows fire normally.
          #
          # The `||` fallback to GITHUB_TOKEN means the workflow keeps
          # working before the PAT is set up. Setup: docs/drift-monitor.md
          # "Optional: PAT for downstream workflow triggers".
          GH_TOKEN: ${{ secrets.DARIO_DRIFT_BOT_PAT || secrets.GITHUB_TOKEN }}
          # The commit status below is written with the job's own token, which
          # carries `statuses: write`; the PAT is not assumed to.
          STATUS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # dario#881 tripwire verdict from the --check capture (see below).
          CHECK_ISSUE_881: ${{ steps.check.outputs.issue_881 }}
          OPEN_PR_STATE: ${{ steps.open_pr.outputs.state }}
          OPEN_PR_URL: ${{ steps.open_pr.outputs.pr_url }}
          OPEN_PR_NUMBER: ${{ steps.open_pr.outputs.pr_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eo pipefail

          # De-dup: one rebake PR at a time.
          if [ "$OPEN_PR_STATE" = "open" ]; then
            echo "existing auto-rebake PR is still open: $OPEN_PR_URL"
            {
              echo "pr_url=$OPEN_PR_URL"
              echo "pr_number=$OPEN_PR_NUMBER"
              echo "skipped=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Run the real bake. Writes src/cc-template-data.json.
          node scripts/capture-and-bake.mjs

          # dario#881 tripwire, second read. The bake above is a SEPARATE live
          # capture from the --check one, and the anomaly is intermittent, so
          # the two can disagree, and the bake's verdict is the one that
          # describes the bundle this PR actually ships. Rewritten (or removed)
          # by every capture-and-bake run, so this is fresh. OR them: either
          # capture carrying the residue is enough to mark the PR, because
          # either way a human is about to look at a base-prompt diff whose
          # provenance is in doubt.
          issue_881_bake=false
          [ -f issue-881-tripwire.txt ] && issue_881_bake=true
          issue_881=false
          if [ "$issue_881_bake" = "true" ] || [ "$CHECK_ISSUE_881" = "true" ]; then
            issue_881=true
          fi
          echo "issue_881=$issue_881" >> "$GITHUB_OUTPUT"

          # Sanity: did the bake actually change the bundle's CONTENT?
          #
          # `git diff --quiet` cannot answer this (dario#990): capture-and-bake
          # restamps `_captured` on every run, so the file is ALWAYS textually
          # dirty and this gate never fired. PR #990 reached the ship gate with
          # a bundle byte-identical to v5.5.17 apart from that timestamp,
          # carrying a patch bump and a CHANGELOG entry for drift that was not
          # in its diff. check-rebake-content.mjs compares key by key and
          # ignores only the transient provenance stamp.
          if ! changed_keys=$(node scripts/check-rebake-content.mjs); then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "bake changed template keys: $changed_keys"

          # Upstream check, before the PR exists, so the PR is opened with the
          # evidence for its own bundle. `npm run build` copied the PREVIOUS
          # bundle into dist/, hence the cp. The script borrows the
          # subscription credential read-only and never refreshes it. Its
          # verdict is read from the file it writes: its exit code alone cannot
          # tell a failed probe from a crash.
          cp src/cc-template-data.json dist/cc-template-data.json
          rm -f upstream-check.json upstream-check.md
          set +e
          node scripts/rebake-upstream-check.mjs > upstream-check.md
          set -e
          upstream=$(node -p "require('./upstream-check.json').outcome" 2>/dev/null || echo error)
          echo "upstream check: $upstream"
          cat upstream-check.md
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
          case "$upstream" in
            pass|fail) ;;
            incomplete)
              echo "::warning title=rebake not opened::the upstream check could not give a verdict on this bake: upstream did not judge every request (it refused the borrowed token, rate-limited, failed or did not answer, or the proxy had no seat to send one with). Its text above says which. No PR is opened; the next run bakes and checks again."
              echo "skipped=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            *)
              echo "::error title=upstream check failed to run::scripts/rebake-upstream-check.mjs did not produce a verdict. No PR is opened."
              exit 1
              ;;
          esac

          cc_version=$(node -p "require('./src/cc-template-data.json')._version")
          branch="bot/template-rebake-$(date -u +%Y%m%d-%H%M%S)"
          git config user.email "actions@github.com"
          git config user.name "cc-drift-template-watch[bot]"
          git checkout -b "$branch"

          # Version-bump + CHANGELOG entry so merging this PR triggers
          # cc-drift-auto-release.yml. Without it the rebake lands on master
          # with no version change, the auto-release version-gate fast-exits,
          # and the freshly-baked template never ships to npm. The entry and
          # rebake-summary.md are both written from the diff of the two
          # bundles, so they name what this bake changes.
          new_version=$(node scripts/rebake-release-prep.mjs)
          echo "new_version=$new_version" >> "$GITHUB_OUTPUT"

          git add src/cc-template-data.json package.json package-lock.json CHANGELOG.md
          git commit -m "auto-rebake: template drift detected $(date -u +%Y-%m-%dT%H:%MZ) (v$new_version)"
          git push origin "$branch"
          head_sha=$(git rev-parse HEAD)

          # The PR body is written from the bundles and from the upstream check.
          # The raw [bake] log stays in the run.
          pr_body_file=$(mktemp)
          {
            echo "## Template rebake for Claude Code $cc_version"
            echo ""
            echo "The drift watcher's \`--check\` found the bundled template out of step with a live capture on the self-hosted runner ([run]($RUN_URL)). This PR carries the re-captured \`src/cc-template-data.json\`, the $new_version version bump and its CHANGELOG entry. Merging publishes $new_version through \`cc-drift-auto-release.yml\`."
            echo ""
            if [ "$issue_881" = "true" ]; then
              echo "> [!CAUTION]"
              echo "> **This rebake may be dario#881 residue and not a Claude Code prompt change.**"
              echo ">"
              echo "> The base system-prompt capture behind this PR matched the known [#881](https://github.com/askalf/dario/issues/881) signature: the extra \`# Context management\` paragraph beginning \"When you have enough information to act, act.\", which appears in roughly 1 local capture in 10. The warning annotation on the run names the clause that matched and the captured and bundled lengths."
              echo ">"
              echo "> **What to do:** dispatch \`cc-drift-template-watch.yml\` again. If the next capture comes back clean, this PR is the anomaly and should be closed. Merging it bakes the residue into the shipped template and cuts a release for a prompt change that did not happen upstream."
              echo ">"
              echo "> **Either way, comment the outcome on #881.** #881 defers bake-time normalisation deliberately, so nothing here strips the paragraph. This is detection only."
              echo ""
            fi
            echo "### What changes"
            echo ""
            cat rebake-summary.md
            echo ""
            echo "\`src/cc-template-data.json\` is captured from Claude Code and scrubbed by the bake. The prompts and tool descriptions in it are Claude Code's wording and are not edited for style: a change to them comes from a bake."
            echo ""
            echo "### Validation"
            echo ""
            cat upstream-check.md
            echo ""
            echo "No other check sends upstream a request rebuilt from the bundle: the test suite is hermetic, and the live-test probe runs the proxy in passthrough mode."
            echo ""
            echo "### How this merges"
            echo ""
            echo "The bundled template is what dario builds requests from when it has no live capture of Claude Code. The upstream check above ran on the bundle in this PR's first commit, and its result is that commit's \`rebake/upstream\` status. The platform review gate merges this PR once the review approves it at its head, the required checks pass, and that status is a pass for the bundle the head still carries. If the check failed, or a later commit changes \`src/cc-template-data.json\`, a person merges."
          } > "$pr_body_file"

          # Title carries the tripwire verdict too: the PR list, the merge-queue
          # view and the email notification all show the title and nothing else.
          pr_title="auto-rebake: template drift detected $(date +%Y-%m-%d)"
          if [ "$issue_881" = "true" ]; then
            pr_title="[#881 residue?] $pr_title"
          fi

          # Labels that make a PR needing attention recognisable from the list
          # alone. Created on demand (--force is a no-op update when the label
          # exists) because each is rare enough that pre-creating it in repo
          # settings would just rot.
          extra_label=()
          if [ "$issue_881" = "true" ]; then
            gh label create issue-881-residue --color D93F0B \
              --description "Rebake whose base capture matched the dario#881 +279-char anomaly, not genuine CC drift" \
              --force >/dev/null 2>&1 || true
            extra_label+=(--label issue-881-residue)
          fi
          if [ "$upstream" = "fail" ]; then
            gh label create upstream-check-failed --color D93F0B \
              --description "Rebake whose bundle was not accepted upstream as subscription traffic" \
              --force >/dev/null 2>&1 || true
            extra_label+=(--label upstream-check-failed)
          fi

          pr_url=$(gh pr create \
            --head "$branch" \
            --base master \
            --title "$pr_title" \
            --body-file "$pr_body_file" \
            --label cc-drift-template "${extra_label[@]}")

          pr_number=$(echo "$pr_url" | grep -oE '[0-9]+$')
          echo "opened $pr_url"

          # The verdict as a commit status on the commit that carries the
          # bundle, so it shows among the PR's checks.
          if [ "$upstream" = "pass" ]; then
            status_state=success
            status_text="Requests rebuilt from this bundle were accepted upstream"
          else
            status_state=failure
            status_text="A request rebuilt from this bundle was not accepted as subscription traffic"
          fi
          GH_TOKEN="$STATUS_TOKEN" gh api "repos/${GITHUB_REPOSITORY}/statuses/${head_sha}" \
            -f state="$status_state" -f context="rebake/upstream" \
            -f description="$status_text" -f target_url="$RUN_URL" >/dev/null \
            || echo "::warning::could not set the rebake/upstream status on $head_sha"

          {
            echo "pr_url=$pr_url"
            echo "pr_number=$pr_number"
            echo "skipped=false"
          } >> "$GITHUB_OUTPUT"

      - name: Label-sync + open PR
        # On LABEL-only drift (exit 3): the live capture's wire shape matches
        # the bundle, but the bundled _version label lags the installed CC
        # version, so sdk-drift-watch.yml flags a pin delta with no shape to
        # re-bake. Ship a deterministic label bump (scripts/label-sync.mjs
        # touches only _version / _supportedMaxTested / the user-agent version
        # token) on a bot/template-label-* branch; the platform review gate
        # merges it once Redline approves and the required checks pass.
        #
        # Merging without a human read is safe here — and NOT for the exit-2
        # rebake above — because exit 3 means computeDrift returned empty: the
        # tool name set, base anthropic_beta set, system_prompt, agent_identity
        # and field orders match at the live version. That is not byte
        # identity: tool descriptions and schemas are not compared, the
        # model-conditional / remote-config betas are filtered from both sides,
        # and the memory path is normalized. Only the version label moves,
        # the same deterministic-bump risk class as cc-drift-watch.yml's
        # SUPPORTED_CC_RANGE.maxTested bump. A red required check leaves the
        # PR open with the bot branch preserved.
        if: steps.check.outputs.exit_code == '3'
        id: labelsync
        env:
          # Same PAT-or-token contract as the rebake step. The PAT identity is
          # what lets downstream CI fire on the PR (GitHub suppresses CI for
          # GITHUB_TOKEN-authored PRs, which would leave it with no checks and
          # nothing able to merge it). With only GITHUB_TOKEN the PR is still
          # opened.
          GH_TOKEN: ${{ secrets.DARIO_DRIFT_BOT_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail

          # De-dup: skip if a bot label-sync PR is already open.
          existing_pr=$(gh pr list --state open --search "head:bot/template-label-" --json url --jq '.[0].url // ""' || echo "")
          if [ -n "$existing_pr" ]; then
            echo "existing label-sync PR still open: $existing_pr — skipping."
            exit 0
          fi

          target=$(tr -d '[:space:]' < label-target.txt)
          if [ -z "$target" ]; then
            echo "::warning::exit 3 but label-target.txt is empty — skipping label-sync."
            exit 0
          fi

          # Deterministic label bump + release-prep. Prints the new dario version.
          new_version=$(node scripts/label-sync.mjs "$target")

          # Sanity: the bump must have changed the bundle (guards a stale
          # label-target.txt or an already-current label).
          if git diff --quiet -- src/cc-template-data.json; then
            echo "::warning::label-sync produced no diff vs HEAD — skipping PR."
            exit 0
          fi

          branch="bot/template-label-$(date -u +%Y%m%d-%H%M%S)"
          git config user.email "actions@github.com"
          git config user.name "cc-drift-template-watch[bot]"
          git checkout -b "$branch"
          # Stage ONLY the four files label-sync touches — never `git add -A`
          # (would sweep in drift-output.txt / label-target.txt CI artifacts).
          git add src/cc-template-data.json package.json package-lock.json CHANGELOG.md
          git commit -m "chore(template): label refresh _version -> v$target (clears sdk-drift) (v$new_version)"
          git push origin "$branch"

          pr_body_file=$(mktemp)
          {
            echo "## Auto label-sync: wire shape unchanged"
            echo ""
            echo "Generated by [\`cc-drift-template-watch.yml\`](.github/workflows/cc-drift-template-watch.yml) on $(date -Iseconds)."
            echo ""
            echo "\`capture-and-bake.mjs --check\` captured **live CC v$target** and \`computeDrift\` returned **zero shape drift** vs the bundled template — but the bundle's \`_version\` label still read the previous version, which \`check-sdk-drift.mjs\` flags against npm (the \`sdk-drift\` signal). There is no wire-shape change to re-bake, so this PR bumps only the version-label fields:"
            echo ""
            echo "- \`_version\` and \`_supportedMaxTested\` -> \`$target\`"
            echo "- the \`claude-cli/<version>\` token in the \`user-agent\` header -> \`$target\`"
            echo ""
            echo "\`_captured\` (last real capture) and \`x-stainless-package-version\` are intentionally left untouched. Patch-bumped to \`v$new_version\` so merging ships via \`cc-drift-auto-release.yml\`, and the next \`sdk-drift-watch\` run auto-closes the signal."
            echo ""
            echo "### Why this is safe to merge"
            echo ""
            echo "Unlike a shape rebake, which changes the wire contract and so also needs the upstream check to pass, this PR's **empty \`computeDrift\`** means the live v$target capture matched the bundle on everything \`computeDrift\` compares: the tool **name** set, the base \`anthropic_beta\` set, the system prompt, \`agent_identity\`, and the body-field and header orders. It is not a byte-identity proof. Tool descriptions and input schemas are not compared (only tool names are); header values are not compared (only header order); the model-conditional and remote-config-gated betas (\`MODEL_CONDITIONAL_BETAS\` / \`REMOTE_CONFIG_CONDITIONAL_BETAS\` in \`scripts/drift-report.mjs\`) are filtered from both sides; and the memory-directory path in the system prompt is normalized before comparison. Only the label moves: the same deterministic-bump risk class as \`cc-drift-watch.yml\`'s \`maxTested\` bump. The review gate still waits for the required checks (build 18/20/22, validate-package-json, analyze, actionlint, live-test, test, docker-cap-drop-smoke); a red check leaves this PR open with the bot branch preserved."
          } > "$pr_body_file"

          pr_url=$(gh pr create \
            --head "$branch" \
            --base master \
            --title "chore(template): label refresh _version -> v$target (clears sdk-drift)" \
            --body-file "$pr_body_file" \
            --label cc-drift-template)
          echo "opened $pr_url"
          # No native auto-merge: the platform review gate merges the PR (and
          # disarmed every arming within seconds while this still armed).

      - name: Open / update drift issue
        if: steps.check.outputs.exit_code == '2'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.rebake.outputs.pr_url }}
          PR_NUMBER: ${{ steps.rebake.outputs.pr_number }}
          REBAKE_SKIPPED: ${{ steps.rebake.outputs.skipped }}
          UPSTREAM: ${{ steps.rebake.outputs.upstream }}
        run: |
          # De-dup: if there's already an open issue labeled cc-drift-template,
          # update it with a new comment instead of opening a duplicate.
          existing=$(gh issue list --label cc-drift-template --state open --json number --jq '.[0].number')
          body_file=$(mktemp)
          {
            echo "## Template drift detected"
            echo ""
            echo "Generated by \`.github/workflows/cc-drift-template-watch.yml\` on $(date -Iseconds)."
            echo ""
            if [ -n "$PR_URL" ]; then
              if [ "$REBAKE_SKIPPED" = "true" ]; then
                echo "**Existing auto-rebake PR still open:** $PR_URL — review + merge to resolve."
              else
                echo "**Auto-rebake PR opened:** $PR_URL. The platform review gate merges it once the review approves, provided the upstream check passed on its bundle. Otherwise a person decides."
              fi
              echo ""
            elif [ "$UPSTREAM" = "incomplete" ]; then
              echo "**Auto-rebake not opened this run:** the bake changed the bundle, but the upstream check could not give a verdict: upstream did not judge every request (it refused the borrowed token, rate-limited, failed or did not answer, or the proxy had no seat to send one with). The run's log says which. The next run bakes and checks again."
              echo ""
            else
              echo "**Auto-rebake skipped** (capture matched HEAD despite --check signal — likely a transient). Investigate manually if this recurs."
              echo ""
            fi
            if [ -f drift-summary.md ]; then
              echo "### Summary"
              echo ""
              cat drift-summary.md
              echo ""
            fi
            echo "### Drift report"
            echo ""
            echo '```'
            cat drift-output.txt
            echo '```'
            echo ""
            echo "Background: [v4.2.1 CHANGELOG entry](https://github.com/askalf/dario/blob/master/CHANGELOG.md#421---2026-05-17) documents this drift class — same CC binary, different runtime wire shape via remote configuration."
          } > "$body_file"

          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            gh issue comment "$existing" --body-file "$body_file"
            echo "Updated existing drift issue #$existing"
          else
            gh issue create \
              --title "CC template drift detected ($(date +%Y-%m-%d))" \
              --label cc-drift-template \
              --body-file "$body_file"
          fi

      - name: Close stale drift issue
        if: steps.check.outputs.exit_code == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # When the template is re-baked + merged, the next clean cycle
          # closes any open drift issue with a confirmation comment.
          existing=$(gh issue list --label cc-drift-template --state open --json number --jq '.[0].number')
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            gh issue close "$existing" --comment "Drift resolved: live capture now matches bundled template ($(date -Iseconds))."
            echo "Closed resolved drift issue #$existing"
          fi
