name: CC billing classifier canary (self-hosted)

# Watches a different signal than the template-drift watcher.
#
# Template drift catches "Anthropic changed what CC SENDS on the wire."
# This canary catches "Anthropic changed what their CLASSIFIER reads on
# the wire." Two distinct failure modes:
#
#   1. CC's wire output changes (caught by cc-drift-template-watch.yml)
#      → dario re-bakes the bundled template, replay tracks
#
#   2. Classifier rules change — new signal added, existing signal
#      tightened, threshold flipped — and the rebuild-from-canonical
#      shape dario sends no longer scores as `subscription`. CC could
#      keep sending exactly the same wire-shape and STILL get reclassified.
#      The template watcher cannot see this. Only an end-to-end "send
#      a real request, inspect the billing bucket" probe can.
#
# Sends one small request through dario's canonical-rebuild mode (the mode
# dario users actually run in — NOT --passthrough) and inspects TWO signals:
#
# (A) BILLING — the `anthropic-ratelimit-unified-representative-claim` header,
#     asserted to a subscription bucket per src/analytics.ts:
#       - subscription:          five_hour, seven_day                    ✓ pass
#       - subscription_fallback: five_hour_fallback, seven_day_fallback  ✓ pass (rate-limit only)
#       - extra_usage:           overage                                 ✗ fail (classifier flip)
#       - api:                   api                                     ✗ fail (classifier flip)
#       - unknown:               anything else                           ⚠ warn (missing/new value)
#
# (B) MODEL DOWNGRADE — the probe requests the TOP model (${PROBE_MODEL}) and
#     asserts the `model` field in the RESPONSE BODY is still Opus. If Anthropic
#     silently serves a cheaper model (Sonnet/Haiku) under load, served != asked
#     and we fail. You cannot detect a downgrade by asking for the cheap model,
#     so the probe deliberately asks for the most expensive one. The
#     undocumented `fallback-percentage` + 5h-utilization headers are captured
#     for the alert (context only — not asserted, meaning isn't documented).
#
# Combined verdict: a billing flip or a CONFIRMED model downgrade → fail; an
# unrecognized billing value → warn. An UNREADABLE served model (empty body
# field) is a note only — it does NOT hold the alert open while billing is
# healthy (that false alarm kept #1003 open for days). See the probe step.
#
# THE CANARY-CANNOT-RUN CASE is a third outcome, neither pass nor fail. This
# job borrows the production subscription credential read-only
# (DARIO_NO_TOKEN_REFRESH=1) and so cannot renew it; when the shared access
# token happens to need renewing at :50, the proxy's OAuth axis is red and no
# probe is possible. That says NOTHING about the billing classifier, and it
# clears itself the moment the platform dario (the sole refresher) rotates —
# run 33958011031 failed this way at 09:27Z and the re-run passed at 11:55Z.
# A red run for a self-clearing condition is a false alarm that costs a
# fleet-watch ticket, so a single blocked run is a WARNING that opens a
# `cc-canary-blocked` tracking issue and exits 0. Only a SUSTAINED block —
# that issue still open after BLOCKED_ESCALATE_HOURS, i.e. the canary has
# genuinely gone blind — turns the run red. Same "one miss is noise, a streak
# is signal" shape as cc-drift-watcher-liveness.yml.
#
# Cost: ~1 small subscription request per day (PROBE_MODEL, ≤ 16 output tokens).
# Cron offset to 05:50 UTC. The old 06:30 slot sat exactly ON the drift
# watcher's :00/:30 every-30-min grid (contrary to what this comment used
# to claim) and inside the 06:30–06:37 single-runner pileup with
# doctor-watch (`37 */6`) and wire-drift. 05:50 is off the :00/:30 grid,
# the hourly :00/:15 scans, and the repo's other daily cron slots.

on:
  schedule:
    - cron: '50 5 * * *'
  workflow_dispatch:
    inputs:
      force_status:
        description: 'Override verdict for this run (validation only — pick "none" for real probe)'
        required: false
        type: choice
        default: none
        options:
          - none
          - pass
          - fail
          - warn

permissions:
  contents: read

env:
  # The model the downgrade-probe requests. It must be the current FLAGSHIP:
  # the probe catches a silent server-side downgrade to a cheaper model, which
  # you can only detect by asking for the most-capable one. Bump when a new top
  # Opus ships (was claude-opus-4-8; claude-opus-5 is flagship and is what the
  # fleet actually runs). One place to change, inherited by every step.
  PROBE_MODEL: claude-opus-5
  # How long the canary may stay blocked on the borrowed credential before a
  # blocked run goes red. One schedule interval: a single 05:50 miss that the
  # next day's run clears stays a warning, but a second consecutive daily miss
  # finds the issue already 24h old and goes red then, not a day later.
  BLOCKED_ESCALATE_HOURS: '24'

jobs:
  canary:
    permissions:
      contents: read
      issues: write
      # Never from a fork. This job is meaningless anywhere but this
      # repository, and 54 forks inherit the schedule. See #1039.
    if: github.repository == 'askalf/dario'
    runs-on: [self-hosted, dario-drift]
    timeout-minutes: 5
    steps:
      - uses: askalf/checkout-with-retry@115a6407547e9711edbc2e915838d495cad9583f  # v1.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22

      - name: Install + build
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Pin OAuth credential to platform-dario canonical (sole-refresher)
        # The platform dario container is the SOLE refresher of the shared Max
        # OAuth. CC / a runner-side dario proxy refreshes via atomic tmp+rename,
        # which REPLACES the /root/.claude symlink with a regular file — splitting
        # the shared refresh-token family across two files that then rotate each
        # other to death via Anthropic refresh-token reuse-detection (the
        # 2026-06-23 fleet outage). Re-link to the container's canonical before
        # starting the runner-side proxy so it reads the always-fresh token and
        # never refreshes here. See docs/recovery.md "OAuth credential dead".
        run: |
          CANON=/var/lib/askalf-dario/credentials.json
          if [ -e "$CANON" ]; then
            mkdir -p /root/.claude /root/.dario
            ln -sfn "$CANON" /root/.claude/.credentials.json
            ln -sfn "$CANON" /root/.dario/credentials.json
            echo "pinned runner OAuth credential -> $CANON (inode $(stat -L -c %i "$CANON"))"
          else
            echo "::warning::canonical $CANON missing — platform dario down? proceeding as-is"
          fi

      - name: Start dario proxy (canonical-rebuild — NOT passthrough)
        id: startup
        # OAuth credential: shares /root/.claude/.credentials.json with the
        # platform dario. An isolated credential was tried and does not work
        # here — with only sparse workflow fires it had no refresh authority
        # between runs and repeatedly died of disuse. And an API key is not an
        # option either: an API key IS the other billing bucket, so it would
        # test the wrong thing. This canary genuinely needs the shared
        # subscription credential.
        #
        # BUT IT MUST NOT REFRESH IT. Anthropic invalidates the previous
        # refresh_token on every refresh, so a rotation here logs out every
        # other holder — production. On 2026-08-25 exactly that happened from
        # a job on this runner and the fleet was down ~3h on `invalid_grant`.
        # Copying the file first does not help; the rotation is upstream.
        #
        # DARIO_NO_TOKEN_REFRESH=1 borrows the credential read-only: requests
        # work while the access token is valid, and a needed renewal fails
        # LOUDLY instead of silently rotating prod's token away. A canary that
        # cannot run is a fixable annoyance; a canary that takes the fleet down
        # is not.
        #
        # NO --passthrough flag: the canary specifically validates dario's
        # rebuild-from-canonical mode, the mode every non-CC dario user
        # runs in.
        #
        # --port=3457 (v4.6.1) — see compat-test-self-hosted.yml for the
        # rationale. The platform runs its own dario at :3456 via docker;
        # without --port the canary's `dario proxy` exits 0 ("already
        # running") and the curl below silently hits the platform dario
        # using PLATFORM credentials, producing 401s that look like
        # classifier flips. Use :3457 so the workflow's own dist actually
        # runs.
        env:
          DARIO_NO_TOKEN_REFRESH: '1'
        run: |
          node dist/cli.js proxy --port=3457 > proxy.log 2>&1 &
          echo $! > proxy.pid
          echo "started dario proxy with PID $(cat proxy.pid)"

          # Wait up to 30s for /health to answer 2xx.
          #
          # A non-2xx answer is NOT the same as no answer, and the difference
          # is the whole point here: dario serves /health with 503 when the
          # OAuth axis is broken (see cc-oauth-health.yml), so a borrowed
          # access token that needs renewing presents as "proxy up, health
          # red" — not as "proxy never started". `curl -sf` collapsed both
          # into one exit code and the job died with the misleading
          # "never reached /health" error, never reaching the careful
          # borrow-mode diagnosis in the probe step below. Keep the last
          # observed status so the real failure branch can report it.
          ready=false
          last_code=000
          for i in $(seq 1 30); do
            last_code=$(curl -s -o health.json -w '%{http_code}' --max-time 2 http://127.0.0.1:3457/health || echo 000)
            case "$last_code" in
              2??) ready=true; echo "proxy ready after ${i}s (HTTP ${last_code})"; break ;;
            esac
            sleep 1
          done

          if [ "$ready" = "true" ]; then
            exit 0
          fi

          # Borrow-mode block: the shared access token needs a renewal this
          # job is deliberately forbidden to perform. Infrastructure timing,
          # not a canary verdict — record it for the tracking step and let
          # the job continue (the probe step is gated off `blocked`).
          if grep -q 'DARIO_NO_TOKEN_REFRESH' proxy.log 2>/dev/null; then
            echo "blocked=borrowed-credential-needs-refresh" >> "$GITHUB_OUTPUT"
            echo "::warning::Canary could not run: the borrowed subscription credential needs refreshing, which this job is deliberately forbidden to do (refreshing would rotate the token out from under production). This says NOTHING about the billing classifier and normally clears itself once the platform dario refreshes. Tracked as a cc-canary-blocked issue; escalates if it persists."
            echo "=== proxy.log tail ==="
            tail -40 proxy.log 2>/dev/null || true
            exit 0
          fi

          echo "::error::dario proxy never reached a healthy /health within 30s (last HTTP status: ${last_code})"
          echo "=== /health body ==="
          head -c 2000 health.json 2>/dev/null || true
          echo ""
          cat proxy.log
          exit 1

      - name: Send canary request + capture billing bucket & served model
        id: probe
        if: steps.startup.outputs.blocked == ''
        env:
          # workflow_dispatch-only override (maintainer-set). Passed via env, not
          # inline ${{ }}, so the value can't break shell quoting or inject into the runner.
          FORCE_STATUS: ${{ github.event.inputs.force_status }}
        run: |
          set -eo pipefail

          # Probe with the TOP model (${PROBE_MODEL}), tiny output budget.
          # Two signals from one request:
          #   1. BILLING — the `representative-claim` response header (which
          #      pool the request billed against).
          #   2. MODEL DOWNGRADE — the `model` field in the response BODY is
          #      the model that actually served the request. We ask for Opus;
          #      if Sonnet/Haiku comes back, Anthropic silently downgraded us
          #      under load. Probing the most-expensive model makes that
          #      substitution detectable (you can't catch a downgrade by
          #      asking for the cheap model). :3457 matches the Start step.
          response_headers=$(mktemp)
          response_body=$(mktemp)
          curl -sS -D "$response_headers" -o "$response_body" \
            -X POST http://127.0.0.1:3457/v1/messages \
            -H "Content-Type: application/json" \
            -H "anthropic-version: 2023-06-01" \
            -H "x-api-key: dario" \
            -d "{\"model\":\"${PROBE_MODEL}\",\"max_tokens\":16,\"messages\":[{\"role\":\"user\",\"content\":\"OK\"}]}" \
            --max-time 30

          # --- Billing signal: representative-claim header (short alias too). ---
          claim=$(grep -iE "^(anthropic-ratelimit-unified-)?representative-claim:" "$response_headers" | head -1 | sed -E 's/^[^:]+:[[:space:]]*//' | tr -d '\r\n[:space:]' || echo "")
          # --- Model-downgrade signal: the served model from the body. ---
          served_model=$(grep -oE '"model"[[:space:]]*:[[:space:]]*"[^"]*"' "$response_body" | head -1 | sed -E 's/.*"([^"]*)"$/\1/' || echo "")
          # --- Context for the alert: fallback dial + 5h-window utilization. ---
          fallback_pct=$(grep -iE "^anthropic-ratelimit-unified-fallback-percentage:" "$response_headers" | head -1 | sed -E 's/^[^:]+:[[:space:]]*//' | tr -d '\r\n[:space:]' || echo "")
          util_5h=$(grep -iE "^anthropic-ratelimit-unified-5h-utilization:" "$response_headers" | head -1 | sed -E 's/^[^:]+:[[:space:]]*//' | tr -d '\r\n[:space:]' || echo "")

          echo "Raw response headers:"
          head -30 "$response_headers"
          echo ""
          echo "Captured: representative-claim='${claim}' served-model='${served_model}' fallback%='${fallback_pct}' 5h-util='${util_5h}'"

          # --- Precondition, checked BEFORE any billing verdict is computed ---
          # This canary borrows a shared subscription credential read-only
          # (DARIO_NO_TOKEN_REFRESH=1, see the proxy step). If the access token
          # expired, the probe gets a 401 with no headers — which would fall
          # through to bucket="unknown" and raise a BILLING alert. That would be
          # a lie: nothing about the classifier changed, the canary simply could
          # not run. It is the same false-alarm shape that held #1003 open for
          # days while dario billed correctly the whole time.
          #
          # The startup step catches this when the token is already stale at
          # boot; this covers the narrower race where it goes stale between a
          # healthy /health and the probe. Write no `status` output at all —
          # the alert step is gated on `status != ''`, so it is skipped rather
          # than opening a misleading billing issue — and hand the run to the
          # blocked-tracking step by setting `blocked` instead of failing here.
          if grep -q 'DARIO_NO_TOKEN_REFRESH' proxy.log 2>/dev/null; then
            echo "blocked=borrowed-credential-needs-refresh" >> "$GITHUB_OUTPUT"
            echo "::warning::Canary could not run: the borrowed subscription credential needs refreshing mid-run, which this job is deliberately forbidden to do. This says NOTHING about the billing classifier. Tracked as a cc-canary-blocked issue; escalates if it persists."
            echo "=== proxy.log tail ==="
            tail -40 proxy.log 2>/dev/null || true
            exit 0
          fi

          # Billing verdict
          case "$claim" in
            five_hour|seven_day)                   bucket="subscription";          billing="pass" ;;
            five_hour_fallback|seven_day_fallback) bucket="subscription_fallback"; billing="pass" ;;
            overage)                               bucket="extra_usage";           billing="fail" ;;
            api)                                   bucket="api";                   billing="fail" ;;
            *)                                     bucket="unknown";               billing="warn" ;;
          esac

          # Model verdict — we asked for Opus 4.8; did Opus serve it?
          case "$served_model" in
            "${PROBE_MODEL}"*) model_verdict="pass" ;;       # served as requested
            "")                model_verdict="unreadable" ;; # body had no model field — probe-quality, NOT a confirmed downgrade
            *)                 model_verdict="fail" ;;       # served a DIFFERENT (cheaper) model — downgrade
          esac

          # Combined verdict. A CONFIRMED downgrade (a real but cheaper model) or
          # a billing flip escalates. An UNREADABLE served model (empty body field)
          # is a probe-quality note, NOT an incident: it must not hold the alert
          # open while billing itself is healthy — that false alarm kept issue
          # #1003 open for days while dario billed correctly the whole time.
          if [ "$billing" = "fail" ] || [ "$model_verdict" = "fail" ]; then
            status="fail"
          elif [ "$billing" = "warn" ]; then
            status="warn"
          else
            status="pass"
          fi
          if [ "$model_verdict" = "unreadable" ]; then
            echo "::warning::model-downgrade probe could not read the served model (empty body field); billing verdict stands (${billing}). Not holding the canary open on this alone."
          fi

          # v4.7.2: workflow_dispatch can override the verdict for
          # validation runs. Lets us exercise the alert-open path
          # (force_status=fail or warn) and the recovery-close path
          # (force_status=pass) on demand. force_status is ignored
          # on scheduled runs (input only populated on dispatch).
          if [ -n "$FORCE_STATUS" ] && [ "$FORCE_STATUS" != "none" ]; then
            echo "::warning::force_status=${FORCE_STATUS} — overriding real verdict (was: claim=${claim} served=${served_model} bucket=${bucket} status=${status})"
            claim="forced-${FORCE_STATUS}"
            case "$FORCE_STATUS" in
              pass) bucket="subscription"; served_model="${PROBE_MODEL}"; model_verdict="pass" ;;
              fail) bucket="extra_usage";  served_model="claude-haiku-4-5"; model_verdict="fail" ;;
              warn) bucket="unknown" ;;
            esac
            status="$FORCE_STATUS"
          fi

          {
            echo "claim=${claim}"
            echo "bucket=${bucket}"
            echo "served_model=${served_model}"
            echo "model_verdict=${model_verdict}"
            echo "fallback_pct=${fallback_pct}"
            echo "util_5h=${util_5h}"
            echo "status=${status}"
          } >> "$GITHUB_OUTPUT"

          echo "Verdict: billing=${billing} bucket=${bucket} | model=${model_verdict} served=${served_model} | status=${status}"

      - name: Stop dario proxy
        if: always()
        run: |
          if [ -f proxy.pid ]; then
            pid=$(cat proxy.pid)
            kill "$pid" 2>/dev/null || true
            for _ in 1 2; do
              sleep 1
              kill -0 "$pid" 2>/dev/null || break
            done
            kill -9 "$pid" 2>/dev/null || true
            rm -f proxy.pid
          fi
          echo "=== proxy.log tail ==="
          tail -40 proxy.log 2>/dev/null || true

      - name: Track / escalate blocked canary
        # Runs only when the canary could not probe because the borrowed
        # credential needed a renewal this job must not perform. One blocked
        # run is expected noise (the platform dario refreshes on its own
        # clock); a blocked canary that STAYS blocked is a blind canary and
        # must go red. The open issue is the streak counter — no state to
        # keep anywhere else, same idiom as the billing alert below.
        if: always() && (steps.startup.outputs.blocked != '' || steps.probe.outputs.blocked != '')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail

          gh label create cc-canary-blocked \
            --description "Billing canary could not run: borrowed OAuth credential needs a refresh it may not perform" \
            --color "FBCA04" 2>/dev/null || true

          existing=$(gh issue list --label cc-canary-blocked --state open --json number --jq '.[0].number')

          note="Blocked at $(date -Iseconds) by [run ${GITHUB_RUN_ID}](../../actions/runs/${GITHUB_RUN_ID}): the shared subscription access token needed renewing, and this job borrows it read-only (\`DARIO_NO_TOKEN_REFRESH=1\`) precisely so it can never rotate production's token away. No probe was sent, so this says **nothing** about the billing classifier."

          if [ -z "$existing" ] || [ "$existing" = "null" ]; then
            gh issue create \
              --title "CC canary blocked: borrowed credential needs refresh ($(date +%Y-%m-%d))" \
              --label cc-canary-blocked \
              --body "$(printf '%s\n\n%s\n\n%s\n' \
                "## Billing classifier canary could not run" \
                "$note" \
                "This issue auto-closes on the next successful probe. If it is still open after ${BLOCKED_ESCALATE_HOURS}h the canary has gone blind and the workflow starts failing: refresh the credential on the box (the platform dario container is the sole refresher — see docs/recovery.md \"OAuth credential dead\"), then \`gh workflow run cc-billing-classifier-canary.yml --ref master\`.")"
            echo "Opened cc-canary-blocked tracking issue"
            exit 0
          fi

          gh issue comment "$existing" --body "$note"
          echo "Updated cc-canary-blocked issue #$existing"

          # Escalate only on a SUSTAINED block. Age of the tracking issue is
          # the streak: it is closed by the first probe that gets through.
          opened_at=$(gh issue view "$existing" --json createdAt --jq .createdAt)
          age_h=$(( ( $(date +%s) - $(date -d "$opened_at" +%s) ) / 3600 ))
          echo "cc-canary-blocked #$existing has been open ${age_h}h (escalate at ${BLOCKED_ESCALATE_HOURS}h)"
          if [ "$age_h" -ge "$BLOCKED_ESCALATE_HOURS" ]; then
            echo "::error::Billing canary has been blocked on the borrowed credential for ${age_h}h (>= ${BLOCKED_ESCALATE_HOURS}h) — it is no longer watching the classifier. See #${existing}."
            exit 1
          fi

      - name: Open / update / close canary alert
        if: always() && steps.probe.outputs.status != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAIM: ${{ steps.probe.outputs.claim }}
          BUCKET: ${{ steps.probe.outputs.bucket }}
          STATUS: ${{ steps.probe.outputs.status }}
          SERVED_MODEL: ${{ steps.probe.outputs.served_model }}
          MODEL_VERDICT: ${{ steps.probe.outputs.model_verdict }}
          FALLBACK_PCT: ${{ steps.probe.outputs.fallback_pct }}
          UTIL_5H: ${{ steps.probe.outputs.util_5h }}
        run: |
          set -eo pipefail

          # A verdict exists, so a probe got through: whatever blocked the
          # canary before is over. Close the tracking issue (and with it the
          # escalation clock) regardless of which verdict this run produced.
          blocked_issue=$(gh issue list --label cc-canary-blocked --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$blocked_issue" ] && [ "$blocked_issue" != "null" ]; then
            gh issue close "$blocked_issue" \
              --comment "Canary probed successfully again ($(date -Iseconds)) — the borrowed credential is valid. Verdict this run: \`${STATUS}\`."
            echo "Closed cc-canary-blocked #$blocked_issue"
          fi

          # Self-heal: ensure the alert label exists. Idempotent.
          gh label create cc-billing-canary \
            --description "Billing classifier canary flipped from subscription bucket" \
            --color "B60205" 2>/dev/null || true

          existing=$(gh issue list --label cc-billing-canary --state open --json number --jq '.[0].number')

          if [ "$STATUS" = "pass" ]; then
            echo "Canary healthy: claim=${CLAIM} bucket=${BUCKET} served=${SERVED_MODEL}"
            if [ -n "$existing" ] && [ "$existing" != "null" ]; then
              gh issue close "$existing" \
                --comment "Canary recovered: claim=\`${CLAIM}\` bucket=\`${BUCKET}\` served=\`${SERVED_MODEL}\` ($(date -Iseconds))."
              echo "Closed stale alert #$existing"
            fi
            exit 0
          fi

          # status is "fail" or "warn" — open or update alert
          if [ "$STATUS" = "fail" ]; then
            severity="🔴 FAIL"
            if [ "$MODEL_VERDICT" = "fail" ]; then
              urgency="immediate — requested ${PROBE_MODEL} but Anthropic served \`${SERVED_MODEL}\` (silent model downgrade)"
            else
              urgency="immediate — dario users are being billed per-token / api right now"
            fi
          else
            severity="🟡 WARN"
            urgency="investigate — a probe signal was missing or had an unrecognized value"
          fi

          body_file=$(mktemp)
          {
            echo "## Billing classifier canary: ${severity}"
            echo ""
            echo "Generated by [\`cc-billing-classifier-canary.yml\`](.github/workflows/cc-billing-classifier-canary.yml) on $(date -Iseconds)."
            echo ""
            echo "- **Captured \`representative-claim\`:** \`${CLAIM:-<missing>}\` → bucket \`${BUCKET}\`"
            echo "- **Requested model:** \`${PROBE_MODEL}\` → **served:** \`${SERVED_MODEL:-<unparseable>}\` (\`${MODEL_VERDICT}\`)"
            echo "- **fallback-percentage:** \`${FALLBACK_PCT:-<missing>}\` · **5h-utilization:** \`${UTIL_5H:-<missing>}\`"
            echo "- **Urgency:** ${urgency}"
            echo ""
            echo "### Likely causes"
            echo ""
            if [ "$MODEL_VERDICT" = "fail" ]; then
              echo "0. **Model downgrade** — requested \`${PROBE_MODEL}\`, Anthropic served \`${SERVED_MODEL}\`. Either a silent server-side substitution to a cheaper model under load, or the OAuth account lost Opus access (tier change / weekly Opus cap hit). Check the \`seven_day_opus\` window utilization and that the Max plan still includes Opus. If billing is still a subscription bucket, this is a *model* change, not a *billing* flip — distinct failure."
            fi
            echo "1. **Anthropic changed the classifier rules** — added a new signal dario doesn't replay, tightened an existing one, or flipped a threshold. Cross-check with the latest [\`cc-drift-template-watch\`](../../actions/workflows/cc-drift-template-watch.yml) report: if that's also flagging drift, the classifier change probably correlates with a wire-shape change in CC."
            echo "2. **Bundled template stale** — but in a way the drift watcher hasn't caught yet (e.g. a new signal slot CC doesn't even populate)."
            echo "3. **OAuth credential is on a different account class** — pro/max account converted to api, or got disabled."
            echo ""
            echo "### How to investigate"
            echo ""
            echo "1. Check recent [drift watcher runs](../../actions/workflows/cc-drift-template-watch.yml) — is there an open \`cc-drift-template\` issue or auto-rebake PR? Wire-shape may already be flagged."
            echo "2. Run the canary manually after any fix: \`gh workflow run cc-billing-classifier-canary.yml --ref master\`"
            echo "3. If the cause is a new classifier signal, expect to need a code change in \`src/cc-template.ts\` to add the new slot to the canonical-rebuild path — and a corresponding template re-bake."
            echo ""
            echo "This alert auto-closes when the canary next returns a subscription bucket."
          } > "$body_file"

          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            gh issue comment "$existing" --body-file "$body_file"
            echo "Updated existing alert #$existing"
          else
            gh issue create \
              --title "CC canary: claim=${CLAIM:-<missing>} served=${SERVED_MODEL:-<?>} ($(date +%Y-%m-%d))" \
              --label cc-billing-canary \
              --body-file "$body_file"
          fi
