# Posts this repository's finished Redline verdicts as sprayberry-redline. A workflow_run job
# runs the default branch's copy of this file, never a pull request's, and the reusable workflow
# runs on GitHub's runners; see scripts/redline/README.md.
name: Redline post

on:
  workflow_run:
    workflows: [Redline]
    types: [completed]

# The called workflow's job token reads the run, its artifact, redline.yml and the PR. The post
# itself uses REDLINE_REVIEWER_TOKEN, and the second lens's post, as sprayberry-secondread,
# REDLINE_SECOND_REVIEWER_TOKEN.
permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  post:
    uses: askalf/ci/.github/workflows/redline-post-verdict.yml@f866115022bb2a95e533d49345a5042485600951 # main 2026-11-26, askalf/ci#243
    with:
      redline-ref: f866115022bb2a95e533d49345a5042485600951
      second-reviewer-login: sprayberry-secondread
    secrets:
      reviewer-token: ${{ secrets.REDLINE_REVIEWER_TOKEN }}
      second-reviewer-token: ${{ secrets.REDLINE_SECOND_REVIEWER_TOKEN }}
