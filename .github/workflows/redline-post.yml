# Posts this repository's finished Redline verdicts as sprayberry-redline. A workflow_run job
# runs the default branch's copy of this file, never a pull request's, and the reusable workflow
# runs on GitHub's runners; see scripts/redline/README.md.
name: Redline post

on:
  workflow_run:
    workflows: [Redline]
    types: [completed]

# The called workflow's job token reads the run, its artifact, redline.yml and the PR. The post
# itself uses REDLINE_REVIEWER_TOKEN.
permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  post:
    uses: askalf/ci/.github/workflows/redline-post-verdict.yml@2d75fe07525bd460f158ef70090cfe812e1768b5 # main 2026-11-04, askalf/ci#177
    with:
      redline-ref: 2d75fe07525bd460f158ef70090cfe812e1768b5
    secrets:
      reviewer-token: ${{ secrets.REDLINE_REVIEWER_TOKEN }}
