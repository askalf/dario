name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  actions: read
  contents: read

jobs:
  analyze:
    permissions:
      actions: read
      contents: read
      security-events: write
      # Never from a fork ON THE SCHEDULE. A forker's own push/PR runs are
      # left alone deliberately -- running security scanning on your own
      # copy is legitimate and must not be broken to save cron minutes.
      # See #1039.
    if: github.event_name != 'schedule' || github.repository == 'askalf/dario'
    # CodeQL runs on GitHub's runners: it sizes itself to the machine, and the exec runners of every
    # repo share one host, so concurrent analyses would exhaust its memory.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: askalf/ci/actions/checkout-with-retry@e6a0901235a1d880cf620d23eece2ba63bd042f9 # main 2026-10-25, askalf/ci#135
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/autobuild@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
