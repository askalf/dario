name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  actions: read
  contents: read

jobs:
  analyze:
    permissions:
      actions: read
      contents: read
      security-events: write
      # Never from a fork ON THE SCHEDULE. A forker's own push/PR runs are
      # left alone deliberately -- running security scanning on your own
      # copy is legitimate and must not be broken to save cron minutes.
      # See #1039.
    if: github.event_name != 'schedule' || github.repository == 'askalf/dario'
    # CodeQL runs on GitHub's runners: it sizes itself to the machine, and the exec runners of every
    # repo share one host, so concurrent analyses would exhaust its memory.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: askalf/checkout-with-retry@115a6407547e9711edbc2e915838d495cad9583f  # v1.1.0
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/autobuild@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
