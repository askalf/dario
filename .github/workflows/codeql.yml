name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  actions: read
  contents: read

jobs:
  analyze:
    permissions:
      actions: read
      contents: read
      security-events: write
      # Never from a fork ON THE SCHEDULE. A forker's own push/PR runs are
      # left alone deliberately -- running security scanning on your own
      # copy is legitimate and must not be broken to save cron minutes.
      # See #1039.
    if: github.event_name != 'schedule' || github.repository == 'askalf/dario'
    # CodeQL runs on GitHub's runners: it sizes itself to the machine, and the exec runners of every
    # repo share one host, so concurrent analyses would exhaust its memory.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: askalf/ci/actions/checkout-with-retry@6479de99a4bf3897d3c09efc7b3d6f24721bf30e # main 2026-11-09, askalf/ci#194
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
