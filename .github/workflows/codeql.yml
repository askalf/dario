name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  actions: read
  contents: read

jobs:
  analyze:
    permissions:
      actions: read
      contents: read
      security-events: write
      # Never from a fork ON THE SCHEDULE. A forker's own push/PR runs are
      # left alone deliberately -- running security scanning on your own
      # copy is legitimate and must not be broken to save cron minutes.
      # See #1039.
    if: github.event_name != 'schedule' || github.repository == 'askalf/dario'
    # Our own code (pushes, same-repo PRs, schedules, dispatches) runs on dario-exec, the
    # non-root one-job runners on our host (platform deploy/gha-runners), so GitHub's hosted
    # queue going down does not hold our PRs. A fork's PR and a Dependabot PR run code nobody
    # here wrote, so they stay on GitHub's runners.
    runs-on: ${{ github.event.pull_request && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]') && 'ubuntu-latest' || fromJSON('["self-hosted","dario-exec"]') }}
    timeout-minutes: 20
    steps:
      - uses: askalf/checkout-with-retry@115a6407547e9711edbc2e915838d495cad9583f  # v1.1.0
      # CodeQL sizes itself to the machine's RAM and cores. On our host that is the whole box, but
      # every exec runner shares one 4G slice, and dario#1531's first run swapped past the job's
      # 20 minutes. On our runner it gets 2G and two threads; on GitHub's, its own defaults.
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          ram: ${{ runner.environment == 'self-hosted' && '2048' || '' }}
          threads: ${{ runner.environment == 'self-hosted' && '2' || '' }}
      - uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          ram: ${{ runner.environment == 'self-hosted' && '2048' || '' }}
          threads: ${{ runner.environment == 'self-hosted' && '2' || '' }}
