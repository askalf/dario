name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  actions: read
  contents: read

jobs:
  analyze:
    permissions:
      actions: read
      contents: read
      security-events: write
      # Never from a fork ON THE SCHEDULE. A forker's own push/PR runs are
      # left alone deliberately -- running security scanning on your own
      # copy is legitimate and must not be broken to save cron minutes.
      # See #1039.
    if: github.event_name != 'schedule' || github.repository == 'askalf/dario'
    # Our own code (pushes, same-repo PRs, schedules, dispatches) runs on dario-exec, our
    # non-root one-job runners, so GitHub's hosted queue going down does not hold our PRs. A
    # fork's PR and a Dependabot PR run code nobody here wrote, and a fork repository has no
    # dario-exec runners, so those stay on GitHub's runners.
    runs-on: ${{ (github.repository != 'askalf/dario' || github.event.pull_request && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]')) && 'ubuntu-latest' || fromJSON('["self-hosted","dario-exec"]') }}
    timeout-minutes: 20
    steps:
      - uses: askalf/checkout-with-retry@115a6407547e9711edbc2e915838d495cad9583f  # v1.1.0
      # CodeQL sizes itself to the machine's RAM and cores. On our runner that is the whole host,
      # whose exec runners share one memory budget, so there it gets 3.5G (less runs out of memory
      # on this codebase) and two threads; on GitHub's runners it keeps its own defaults.
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          ram: ${{ runner.environment == 'self-hosted' && '3584' || '' }}
          threads: ${{ runner.environment == 'self-hosted' && '2' || '' }}
      - uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          ram: ${{ runner.environment == 'self-hosted' && '3584' || '' }}
          threads: ${{ runner.environment == 'self-hosted' && '2' || '' }}
