name: Pricing drift watch

# Diffs dario's PRICING table against Anthropic's published rates, and (since
# 6.6.1) OPENAI_PRICING against OpenAI's — the rates behind every ChatGPT-leg
# row in the ledger.
#
# WHY. PRICING encodes external facts with no natural expiry. An entry is
# correct when written, has a passing test, and then goes silently wrong the
# moment Anthropic changes a price. Twice already:
#
#   - Sonnet 5's increase to $3/$15 was cancelled and $2/$10 made permanent,
#     while the dated cutover stayed in the table — from 2026-09-01 every
#     Sonnet 5 record would have priced 50% high (#1047).
#   - Haiku 4.5 carried Haiku 3.5's rates, ~20% low, for an unknown period —
#     found by the first run of the checker this workflow drives (#1048).
#
# The repo already watches every other external fact this way (cc-drift-watch,
# cc-drift-template-watch, sdk-drift-watch, npm-drift-watch). Pricing was the
# one feeding a user-visible number with nothing watching it.
#
# CHEAP: one HTTPS GET of a ~43KB markdown page plus a build. No npm registry,
# no CC download. Daily is plenty — prices move rarely, and the cost of
# noticing a day late is a slightly stale cost estimate, not an outage.
#
# EXIT CODES (scripts/check-pricing-drift.mjs):
#   0 aligned  -> close any open issue
#   1 drift    -> open/refresh the issue
#   2 could not fetch -> WARN AND PASS, never treated as drift
#   3 fetched but could not read -> open/refresh the issue: the watcher is BLIND
#
# Exit 2 is the transient case: network failure, the page unreachable. Exit 3
# is the page's shape changing under the parser — a renamed column, a parse
# too thin to trust. It used to share exit 2, and on 2026-09-02 Anthropic
# renamed one column: ten daily runs answered "could not determine" as a
# warning in this log, nothing was filed, and the table sat unwatched. A
# watcher that cannot read the page is as blind as one reporting "aligned"
# from nothing, so that case is filed now, on the same issue drift uses.

on:
  schedule:
    # 09:23 UTC daily. Off the hour and clear of the drift watchers, which
    # cluster at :00/:15/:27/:41/:47.
    - cron: '23 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pricing-drift-watch
  cancel-in-progress: false

jobs:
  pricing-drift-check:
    name: Check published pricing
    # Never from a fork. 54 forks inherit this schedule, and a fork filing
    # pricing issues into its own tracker helps nobody. See #1039.
    if: github.repository == 'askalf/dario'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: askalf/checkout-with-retry@115a6407547e9711edbc2e915838d495cad9583f  # v1.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'

      # The checker imports PRICING from dist/, so the build has to run. It is
      # the only reason this job needs npm at all.
      - name: Build
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Check pricing drift
        id: check
        run: |
          # `|| status=$?`, NOT a bare call: this step runs under the runner's
          # default `bash -e {0}`, so a non-zero exit would kill it before the
          # status could be captured — and exit 1 is DRIFT, the case this exists
          # to report. As an AND-OR list the failure is exempt from `set -e`.
          status=0
          node scripts/check-pricing-drift.mjs > pricing-drift.json 2>pricing-drift.err || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat pricing-drift.json || true
          cat pricing-drift.err >&2 || true
          exit 0

      # Status 1 is drift, status 3 is a page the parser no longer reads (the watcher is blind there
      # until it is fixed, which is worth an issue too). Status 2, could not fetch, writes nothing and
      # reports nothing in either direction: opening would be a false alarm, and closing would retract
      # a real finding because a page happened to be unreachable.
      - name: Write the report
        if: steps.check.outputs.status == '1' || steps.check.outputs.status == '3'
        env:
          STATUS: ${{ steps.check.outputs.status }}
        run: |
          set -euo pipefail
          if [ "$STATUS" = "3" ]; then
            {
              echo "\`scripts/check-pricing-drift.mjs\` fetched a published pricing page but could not read it — the watcher is blind on that provider until the parser is updated, and any real drift there goes unseen."
              echo
              echo '```json'
              cat pricing-drift.json
              echo '```'
              echo
              echo "**Fix:** compare the page against \`parsePricingTable\` / \`parseOpenAiPricingTable\` (column names, heading, cell format), update the parser, then re-run \`node scripts/check-pricing-drift.mjs\` (exit 0 = aligned, 1 = drift, 3 = still blind)."
              echo
              echo "_Auto-filed by \`pricing-drift-watch.yml\`._"
            } > body.md
            exit 0
          fi
          {
            echo "\`scripts/check-pricing-drift.mjs\` found a dario price table out of sync with the published rates ([Anthropic](https://platform.claude.com/docs/en/about-claude/pricing) for \`PRICING\`, [OpenAI](https://developers.openai.com/api/docs/pricing) for \`OPENAI_PRICING\`; each row names its provider)."
            echo
            echo "Every row below feeds \`estimatedCost\` in \`/analytics\`, the ledger's API-equivalent spend, the TUI's cost column and \`dario doctor\`. A wrong rate here is not cosmetic — it is a number users quote."
            echo
            echo '```json'
            cat pricing-drift.json
            echo '```'
            echo
            echo "**Fix:** update \`PRICING\` / \`OPENAI_PRICING\` in \`src/analytics.ts\` to match the \`published\` column, then re-run \`node scripts/check-pricing-drift.mjs\` (exit 0 = aligned). If a rate genuinely should differ from the published one, say why in a comment beside the entry — an unexplained divergence will be re-reported here every day."
            echo
            echo "_Auto-filed by \`pricing-drift-watch.yml\`._"
          } > body.md

      # One issue under pricing-drift whichever report it carries: the label is the key, as before,
      # so a blind watcher and a drift are one open thread, refreshed with each day's report and
      # closed on the first aligned run.
      - name: Report
        if: steps.check.outputs.status == '0' || steps.check.outputs.status == '1' || steps.check.outputs.status == '3'
        uses: askalf/ci/actions/drift-report@3ff81710acee0124cebda98e6400787035280a99 # main 2026-10-10, askalf/ci#42
        with:
          label: pricing-drift
          label-color: 1D76DB
          label-description: dario's PRICING table diverges from Anthropic's published rates
          issue: ${{ steps.check.outputs.status == '1' || steps.check.outputs.status == '3' }}
          issue-title: "${{ steps.check.outputs.status == '3' && 'Pricing watch is blind: a published pricing page changed shape' || 'Pricing drift: dario''s PRICING table diverges from published rates' }}"
          issue-body-file: body.md
          close: ${{ steps.check.outputs.status == '0' }}
          close-comment: "Resolved: dario's PRICING table matches the published rates on [run #${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
