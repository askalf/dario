# Redline, the gating code review, as this repo's CI check. The review itself lives in
# askalf/askalf (redline-review.yml): same-repo PRs only, read-only tools, verdict = pass or fail.
name: Redline

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: redline-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Same-repo PRs only, and not drafts: gated here as well as in the called workflow, so a
    # fork's code never reaches the self-hosted runner even if the callee changes.
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    # Pinned so a change to the review workflow reaches this repo only through a reviewed bump here.
    uses: askalf/askalf/.github/workflows/redline-review.yml@35a0ee3805b3d0ae6df3a7ca63bfebf35a76c6af  # main 2026-09-25, askalf/askalf#63
    with:
      runner-label: dario-drift
