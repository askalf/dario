# Redline, the gating code review, as this repo's CI check. The review itself lives in
# askalf/ci (redline-review.yml): read-only tools, verdict = pass or fail. On pull_request it reviews same-repo PRs.
# A workflow_dispatch on the default branch also reviews a head the pull_request run cannot vouch for
# (a PR that changes CI, a refused verdict, a re-read after a description edit); that run
# executes the default branch's workflow files, not the PR's, and reviews the head it is given.
name: Redline
# The dispatcher finds its run by this title; keep its format exact.
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Redline review {0}#{1} @ {2}{3}', github.repository, inputs.pr, inputs.head, inputs.reread && ' (re-read)' || '') || github.event.pull_request.title }}

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number.
        required: true
        type: string
      head:
        description: The full commit sha to review. The run fails if the PR is not at it.
        required: true
        type: string
      reread:
        description: Review the head again even when a Redline verdict already stands there.
        required: false
        default: false
        type: boolean

# actions: read is for the called review's fork-dispatch check, which reads this repository's
# pull_request runs and jobs; the called workflow cannot hold more than is granted here.
permissions:
  actions: read
  contents: read
  pull-requests: read

# On pull_request the newest push wins. A dispatch gets a group of its own per head and mode, and
# is never cancelled: a group holds one pending run and a newer one cancels it, and a cancelled
# dispatch leaves the dispatcher no verdict to read. It sends one dispatch per head and mode at a time.
concurrency:
  group: redline-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.pr }}${{ inputs.head && format('-{0}-{1}', inputs.head, inputs.reread) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  review:
    # Same-repo PRs only, and not drafts: gated here as well as in the called workflow, so a
    # fork's code never reaches the self-hosted runner even if the callee changes. A dispatch is
    # checked by the called workflow (open, not a draft, head in this repo) before anything is fetched.
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository)
    # Pinned so a change to the review workflow reaches this repo only through a reviewed bump here.
    uses: askalf/ci/.github/workflows/redline-review.yml@4365d12f956b60e795b5b55451e2035549a3600c # main 2026-11-01, askalf/ci#153
    with:
      redline-ref: 4365d12f956b60e795b5b55451e2035549a3600c
      # redline is a per-repository ephemeral runner under its own account, reset between
      # jobs; the review never runs as root on the host.
      runner-label: redline
      pr: ${{ inputs.pr }}
      head: ${{ inputs.head }}
      reread: ${{ inputs.reread == true }}
