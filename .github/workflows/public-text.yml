# Public text: fails a pull request that adds an em or en dash to an added line, its title or
# description, or a commit message, or whose title, description or a commit message credits a
# model or an AI tool. The check is askalf/ci's public-text.yml, called at a pinned commit; it
# reads the pull request through the API and checks out none of its code.
name: Public text

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: public-text-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  public-text:
    uses: askalf/ci/.github/workflows/public-text.yml@2d75fe07525bd460f158ef70090cfe812e1768b5 # main 2026-11-04, askalf/ci#177
    with:
      redline-ref: 2d75fe07525bd460f158ef70090cfe812e1768b5
