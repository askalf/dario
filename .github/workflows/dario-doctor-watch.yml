name: dario doctor drift watch

# BUILDOUT-06. Runs `docker exec askalf-dario dario doctor --obedience` on a
# schedule and files one dedup'd issue when it surfaces a runtime drift no
# other watcher catches:
#   - OAuth not OK            -> bearer/refresh dead or expiring; dario 401s every
#                                non-Haiku call until re-authed (the recurring
#                                identity-drift time-sink).
#   - Template "live capture" -> the stale ~/.dario/cc-template.live.json shadow
#                                is masking the bundled template.
#   - Identity WARN           -> OAuth-bearer/userID mismatch (doctor detects this
#                                in pool mode; single-account shows INFO).
#   - Obedience FAIL          -> a model family answered a client-system probe but
#                                ignored the instruction (dario#509 — the
#                                2026-06-12 sonnet class; behavioral, upstream-
#                                influenced: investigate presentation/merge, not
#                                necessarily a dario bug).
#
# Must run on the self-hosted dario-drift runner (same host as the askalf-dario
# container) so `docker exec` reaches it — contrast sdk-drift-watch, which is
# metadata-only on ubuntu-latest. Detection only; mirrors that watch's
# open/refresh-one-issue + auto-close-on-clean + crash-vs-drift contract.

on:
  schedule:
    - cron: '37 */6 * * *'   # every 6h at :37, offset from the other watchers
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dario-doctor-watch
  cancel-in-progress: false

jobs:
  doctor-drift-check:
    permissions:
      contents: read
      issues: write
      # Never from a fork. This job is meaningless anywhere but this
      # repository, and 54 forks inherit the schedule. See #1039.
    if: github.repository == 'askalf/dario'
    runs-on: [self-hosted, dario-drift]
    # 8 min: the obedience probe's worst case is 3 serial attempts × 30s per
    # family (families in parallel) on top of doctor's local checks.
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: askalf/checkout-with-retry@115a6407547e9711edbc2e915838d495cad9583f  # v1.1.0

      - name: Run dario doctor drift check
        id: check
        run: |
          set +e
          node scripts/check-doctor-drift.mjs > doctor-drift.json 2> doctor-drift.err
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 0 ]; then
            echo "dario doctor clean — OAuth OK, no template shadow, identity not WARN, obedience probes pass."
            cat doctor-drift.json
            exit 0
          fi
          if [ "$code" -eq 1 ]; then
            echo "dario doctor DRIFT detected:"
            cat doctor-drift.json
            exit 0   # real drift is handled by the issue step below, not a job failure
          fi
          # Any other exit (3): doctor couldn't run / output unparseable -> infra
          # or format error. Surface red rather than as a false drift issue.
          echo "::error::check-doctor-drift.mjs could not run dario doctor (exit $code) — infra/format error, not drift."
          cat doctor-drift.err
          exit "$code"

      - name: Write the drift report
        if: steps.check.outputs.exit_code == '1'
        run: |
          set -eo pipefail
          {
            echo "## dario doctor drift detected"
            echo ""
            echo "Generated by \`.github/workflows/dario-doctor-watch.yml\` on $(date -Iseconds)."
            echo ""
            echo "\`scripts/check-doctor-drift.mjs\` parsed \`docker exec askalf-dario dario doctor\` and found drift the other watchers don't cover:"
            echo ""
            echo '```json'
            cat doctor-drift.json
            echo '```'
            echo ""
            echo "**OAuth** drift = the deployed bearer/refresh is dead or expiring; dario 401s every non-Haiku call until re-authed. **Template \"live capture\"** = the stale \`~/.dario/cc-template.live.json\` is shadowing the bundled template. **Identity WARN** = bearer/userID mismatch. Fix the live proxy (re-auth / clear the live-cache); this auto-closes on the next clean run."
            echo ""
            echo "**Obedience FAIL** = a model family answered the probe but ignored the client system prompt (dario#509 — the 2026-06-12 sonnet class). This property is behavioral and upstream-influenced: a failure means *investigate the system-prompt presentation/merge* (\`CLIENT_SYSTEM_PREFACE\`, block-3 structure in \`src/cc-template.ts\`), not necessarily \"dario bug\" — and version bisects are the wrong first move (the original incident's bisects were all negative because nothing on dario's side had changed). Confirm delivery with a wire dump before touching anything else."
          } > issue-body.md

      # One issue under dario-doctor-drift, refreshed with the run's report while the drift lasts,
      # closed on the first clean run. Exit 2 (doctor could not run) touches nothing.
      - name: Report
        if: steps.check.outputs.exit_code == '1' || steps.check.outputs.exit_code == '0'
        uses: askalf/ci/actions/drift-report@db7bc038315e4dec6f290fcab2aa802db64f8d73 # main 2026-10-11, askalf/ci#44
        with:
          label: dario-doctor-drift
          label-color: D93F0B
          label-description: dario doctor surfaced OAuth / template-shadow / identity / obedience drift (dario-doctor-watch.yml)
          issue: ${{ steps.check.outputs.exit_code == '1' }}
          issue-title: dario doctor drift detected
          issue-body-file: issue-body.md
          close: ${{ steps.check.outputs.exit_code == '0' }}
          close-comment: "Auto-closed: dario doctor clean (OAuth OK, no template shadow, identity not WARN, obedience probes pass) on [run #${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
