name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  validate-package-json:
    # Our own code (pushes, same-repo PRs, schedules, dispatches) runs on dario-exec, our
    # non-root one-job runners, so GitHub's hosted queue going down does not hold our PRs. A
    # fork's PR and a Dependabot PR run code nobody here wrote, and a fork repository has no
    # dario-exec runners, so those stay on GitHub's runners.
    runs-on: ${{ (github.repository != 'askalf/dario' || github.event.pull_request && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]')) && 'ubuntu-latest' || fromJSON('["self-hosted","dario-exec"]') }}
    timeout-minutes: 5
    # `issues: read` and `pull-requests: read` are for the closing-keyword gate
    # below — it has to ask who filed the issue a `Fixes #N` points at, and
    # read the PR's commit messages. Read-only, and a fork PR's token already
    # carries both on a public repo.
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: askalf/checkout-with-retry@115a6407547e9711edbc2e915838d495cad9583f  # v1.1.0
      - name: package.json is valid JSON and canonically formatted
        run: node scripts/check-package-json.mjs

      # Kept in this job rather than a new one so it does not add a required
      # status check to branch protection -- it is the same class of cheap
      # metadata assertion, and it needs no npm install.
      - name: README line-count claim still matches src/
        run: node scripts/check-readme-line-count.mjs

      # Links rot the same way the line count does: a doc gets renamed, a
      # heading gets reworded, and the README keeps pointing at the old name.
      # No network — relative files and #anchors only.
      - name: README links and anchors resolve
        run: node scripts/check-readme-links.mjs

      # Artifact-level defects a green `npm test` cannot catch: conflict
      # markers left in a tracked file, a lockfile that stopped being valid
      # JSON, versions drifting between package.json / lockfile / CHANGELOG,
      # a release entry buried in the CHANGELOG's header comment. All four
      # shipped for real during the 2026-08-25 release collision. Same cheap
      # no-install class as the two above, so it lives in this job.
      - name: preflight — release artifacts are internally consistent
        run: node scripts/preflight.mjs

      # A PR that changes src/ must add a CHANGELOG bullet. v6.0.22 shipped six
      # changes and its release notes listed two — four PRs skipped the
      # convention. Escape hatch: the `no-changelog` label. pull_request only:
      # a push to master has no base to diff against.
      - name: changelog — src/ changes carry a CHANGELOG entry
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # github.sha on pull_request is the MERGE commit checkout put at HEAD:
          # base with this PR applied. Diffing base against the PR's own head
          # instead would surface unrelated commits merged to base since the
          # fork, in reverse, and fail a docs-only PR.
          HEAD_SHA: ${{ github.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          node scripts/check-changelog.mjs

      # The version bump on master IS the release (cc-drift-auto-release tags
      # and publishes on merge), so an outside contributor's fork PR may not
      # carry one. dario#1450 bumped to 6.12.8 unasked and the merge published
      # it. Same-repo branches (maintainers, the drift bots) are exempt.
      # pull_request only, like the changelog gate above.
      - name: release authority — an outside contributor's PR does not cut a release
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          node scripts/check-release-authority.mjs

      # A PR may not auto-close an issue somebody else filed. #1245 merged with
      # a closing keyword on #1244 while the reporter was still mid-conversation,
      # and GitHub closed the thread on him. `Addresses #N` links without
      # closing. Title, body AND every commit message on the branch: this repo
      # squash-merges with the commit messages as the commit body, and #1255 —
      # the PR that added this gate — closed #1244 again through a keyword
      # quoted in its first commit message, which the gate never read.
      # pull_request only: on a push the text is already merged and the gate
      # has nothing left to stop — keyword-close-notice.yml covers that side.
      - name: issue links — no closing keyword on somebody else's issue
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-issue-close-keywords.mjs

  build:
    needs: validate-package-json
    runs-on: ${{ (github.repository != 'askalf/dario' || github.event.pull_request && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]')) && 'ubuntu-latest' || fromJSON('["self-hosted","dario-exec"]') }}
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: askalf/checkout-with-retry@115a6407547e9711edbc2e915838d495cad9583f  # v1.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run audit
      - run: npm run build
      - run: node dist/cli.js help
      - run: node dist/cli.js status

  # Unit suite. `npm test` (test/all.test.mjs) fans out every test/*.mjs as
  # a node:test subtest EXCEPT the live-integration files (e2e / compat /
  # stress / stealth — they need a running proxy, a real key, or a
  # subscription). Build first: the tests import compiled code from dist/.
  # Guards against silent unit-test rot — the build job above only runs
  # `cli help`/`status`, so a stale assertion (an alias bump, a prompt
  # rename) used to sit red on master unnoticed. The one binary-dependent
  # test (oauth-detector) skips itself when no `claude` is on PATH, which
  # is the case on a GitHub-hosted runner.
  test:
    needs: validate-package-json
    runs-on: ${{ (github.repository != 'askalf/dario' || github.event.pull_request && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]')) && 'ubuntu-latest' || fromJSON('["self-hosted","dario-exec"]') }}
    timeout-minutes: 15
    steps:
      - uses: askalf/checkout-with-retry@115a6407547e9711edbc2e915838d495cad9583f  # v1.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm test

  # Docker smoke test under cap_drop: ALL — catches the class of regression
  # that shipped twice on 2026-05-14 (v3.37.16 + v3.37.17) where a Dockerfile
  # change introduced a privilege flow (chown / su-exec) that requires
  # capabilities stripped by the hardened-container default. The askalf
  # platform compose runs dario this way; the published image must remain
  # compatible.
  #
  # The smoke needs a Docker daemon, and dario-exec has none (Docker on our host is root). So
  # the image is built and run on GitHub's runners, on every push to master and on a PR that
  # changes what the entrypoint's privilege flow depends on: the Dockerfile, the entrypoint,
  # .dockerignore, the lockfile or this file. The required check docker-cap-drop-smoke runs on
  # our runner and passes only when that smoke passed or was not owed, so a PR that changes
  # none of them never waits on GitHub's queue. `build` and `test` cover the CLI itself.
  docker-inputs:
    needs: validate-package-json
    runs-on: ${{ (github.repository != 'askalf/dario' || github.event.pull_request && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]')) && 'ubuntu-latest' || fromJSON('["self-hosted","dario-exec"]') }}
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: askalf/checkout-with-retry@115a6407547e9711edbc2e915838d495cad9583f  # v1.1.0
        with:
          persist-credentials: false
      - id: diff
        name: does the image's start-up depend on a changed file
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          files=$(git diff --name-only "$BASE_SHA" HEAD)
          echo "$files"
          if printf '%s\n' "$files" | grep -qE '^(Dockerfile|docker-entrypoint\.sh|\.dockerignore|package-lock\.json|\.github/workflows/ci\.yml)$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  docker-image-smoke:
    needs: docker-inputs
    if: needs.docker-inputs.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: askalf/checkout-with-retry@115a6407547e9711edbc2e915838d495cad9583f  # v1.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (single-arch, no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          tags: dario-ci-cap-test:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: '--help under cap_drop: ALL + no-new-privileges (must succeed)'
        run: |
          # Catches both the v3.37.16 (chown EPERM) and v3.37.17 (su-exec
          # setgroups EPERM) failure modes in a single test.
          docker run --rm \
            --cap-drop=ALL \
            --security-opt=no-new-privileges:true \
            dario-ci-cap-test:latest --help > /tmp/help-out.txt 2>&1
          test -s /tmp/help-out.txt  # non-empty output
          grep -q 'login\|proxy\|doctor' /tmp/help-out.txt  # has command list

      - name: 'doctor under cap_drop: ALL (entrypoint exec test)'
        run: |
          # doctor exit code is content-driven (1 if any [FAIL] row, 0
          # otherwise). A fresh container has no credentials, so OAuth fails,
          # so exit code is 1 — that's not a regression we care about here.
          # The regression class this test guards against is "entrypoint
          # crashed before exec'ing the CLI" — detected by checking the
          # CLI actually produced the doctor report (version + Node rows).
          docker run --rm \
            --cap-drop=ALL \
            --security-opt=no-new-privileges:true \
            dario-ci-cap-test:latest doctor > /tmp/doctor-out.txt 2>&1 || true
          echo '--- doctor output ---'
          cat /tmp/doctor-out.txt
          echo '--- assertions ---'
          test -s /tmp/doctor-out.txt
          grep -q 'dario.*v[0-9]' /tmp/doctor-out.txt  # version row populated
          grep -q 'Node.*v' /tmp/doctor-out.txt        # Node row present
          echo 'PASS'

      - name: 'no entrypoint restart-loop under cap_drop: ALL'
        run: |
          # The regression class we're guarding: entrypoint script crashes
          # under cap_drop because chown / su-exec / setgroups need caps the
          # config strips, container enters Docker's restart-backoff loop.
          # That manifests as State.Status=restarting and RestartCount>1.
          #
          # We do NOT assert proxy actually serves requests — without OAuth
          # credentials it exits cleanly with exit code 1 ("Not authenticated.
          # Run `dario login` first."), which is correct behavior and not the
          # regression class. An exited container is fine; a restarting one
          # is the bug.
          docker volume create dario-ci-test-vol
          # No --restart policy — we want a single attempt. If the entrypoint
          # crashes the way v3.37.16/17 did, the user's compose has
          # restart: unless-stopped which loops it; we don't need to
          # reproduce that in CI, we just need to see that the entrypoint's
          # FIRST exec succeeded.
          docker run -d --name dario-cap-smoke \
            --cap-drop=ALL \
            --security-opt=no-new-privileges:true \
            -p 13456:3456 \
            -v dario-ci-test-vol:/home/dario/.dario \
            -e DARIO_NO_BUN=1 \
            -e DARIO_API_KEY=ci-cap-smoke-secret \
            dario-ci-cap-test:latest proxy

          # Give the container time to either start serving or finish exiting.
          sleep 10

          STATUS=$(docker inspect dario-cap-smoke --format '{{.State.Status}}')
          RESTART_COUNT=$(docker inspect dario-cap-smoke --format '{{.RestartCount}}')

          echo "container status: $STATUS"
          echo "restart count:    $RESTART_COUNT"
          echo '--- last 30 log lines ---'
          docker logs dario-cap-smoke 2>&1 | tail -30

          # Assertions:
          #   - "restarting" → entrypoint crashed, Docker is retrying (REGRESSION)
          #   - exited / running → entrypoint exec'd the CLI successfully
          #     (the CLI may then have cleanly exited on missing OAuth, which is
          #     not the regression class we're guarding)
          test "$STATUS" != "restarting"

          # Scan logs for the exact error strings v3.37.16 and v3.37.17 emitted.
          # If either appears, the regression is back. Use if/then so set -e
          # doesn't get confused by the leading-! pattern (SC2251).
          if docker logs dario-cap-smoke 2>&1 | grep -q "chown: .* Permission denied"; then
            echo "REGRESSION: v3.37.16-class chown EPERM detected" >&2
            exit 1
          fi
          if docker logs dario-cap-smoke 2>&1 | grep -q "su-exec: setgroups: Operation not permitted"; then
            echo "REGRESSION: v3.37.17-class su-exec setgroups EPERM detected" >&2
            exit 1
          fi

          docker rm -f dario-cap-smoke
          docker volume rm dario-ci-test-vol

  docker-cap-drop-smoke:
    needs: [docker-inputs, docker-image-smoke]
    if: always()
    runs-on: ${{ (github.repository != 'askalf/dario' || github.event.pull_request && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]')) && 'ubuntu-latest' || fromJSON('["self-hosted","dario-exec"]') }}
    timeout-minutes: 5
    steps:
      - name: the image smoke passed, or no change owed one
        env:
          INPUTS: ${{ needs.docker-inputs.result }}
          CHANGED: ${{ needs.docker-inputs.outputs.changed }}
          SMOKE: ${{ needs.docker-image-smoke.result }}
        run: |
          echo "docker-inputs: $INPUTS (changed=$CHANGED), docker-image-smoke: $SMOKE"
          test "$INPUTS" = success
          if [ "$CHANGED" = true ]; then test "$SMOKE" = success; fi
