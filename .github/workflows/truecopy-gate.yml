# Gates the tool surface of `dario mcp` with truecopy. mcp/dario.json is the
# server's real tools/list response (scripts/dump-mcp-tools.mjs), pinned in
# truecopy.lock. The chain is code -> manifest (--check) -> lock (truecopy
# verify): a change to a tool's name, description or schema fails until the
# manifest is regenerated and re-pinned with `truecopy add`, which poison-scans
# it first. Nothing here reads credentials or starts a proxy.
name: truecopy gate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# attestations: read lets the action check the Sigstore attestation of the
# truecopy tarball before installing it.
permissions:
  contents: read
  attestations: read

jobs:
  verify:
    name: verify pinned tool surface
    # Our own code (pushes, same-repo PRs, schedules, dispatches) runs on dario-exec, our
    # non-root one-job runners, so GitHub's hosted queue going down does not hold our PRs. A
    # fork's PR and a Dependabot PR run code nobody here wrote, and a fork repository has no
    # dario-exec runners, so those stay on GitHub's runners.
    runs-on: ${{ (github.repository != 'askalf/dario' || github.event.pull_request && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]')) && 'ubuntu-latest' || fromJSON('["self-hosted","dario-exec"]') }}
    timeout-minutes: 10
    steps:
      - uses: askalf/ci/actions/checkout-with-retry@49207ae5b13cac141745664b06dd846bff867bae # main 2026-10-22, askalf/ci#101
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: mcp/dario.json matches the tool surface
        run: node scripts/dump-mcp-tools.mjs --check
      - name: truecopy verify
        uses: askalf/truecopy-action@1c751a921d3bacb73f30c66054c7fe293ca6743d # v1.1.2
        with:
          verify-attestation: 'true'
