# Runs the fleet-status script's tests on the PR's own code, read-only.
# The paths are every file the tests read: the script, the tests, and the workflows, whose
# pull_request triggers the tests check against fleet-status.yml's workflow_run list.
# self-test is not a required check here, so a PR that touches none of them runs nothing.
name: Fleet status self-test

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/**
      - scripts/fleet-status.mjs
      - test/fleet-status.mjs

permissions: {}

jobs:
  self-test:
    # Our own code (pushes, same-repo PRs, schedules, dispatches) runs on dario-exec, our
    # non-root one-job runners, so GitHub's hosted queue going down does not hold our PRs. A
    # fork's PR and a Dependabot PR run code nobody here wrote, and a fork repository has no
    # dario-exec runners, so those stay on GitHub's runners.
    runs-on: ${{ (github.repository != 'askalf/dario' || github.event.pull_request && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]')) && 'ubuntu-latest' || fromJSON('["self-hosted","dario-exec"]') }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: askalf/checkout-with-retry@115a6407547e9711edbc2e915838d495cad9583f  # v1.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Test the lane rules
        run: node test/fleet-status.mjs
