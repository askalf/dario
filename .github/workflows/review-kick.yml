# Wakes the fleet's deterministic review dispatcher the moment a PR head
# changes, instead of leaving the PR to wait for the dispatcher's timer. The
# dispatcher is idempotent (a WHERE NOT EXISTS on the ticket title), so a kick
# can never double-file a review; it only moves the timer's next run to now.
#
# Same gate as live-test: same-repo, non-draft, not dependabot. A fork PR is
# not reviewed by the fleet, so it has nothing to kick.
name: Review kick

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: review-kick
  cancel-in-progress: false

jobs:
  kick:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: [self-hosted, dario-drift]
    timeout-minutes: 15
    steps:
      - name: Run review-dispatch now
        run: |
          # A run already in flight listed the open PRs before this push landed,
          # so it cannot be trusted to have seen this head: wait it out, then
          # run again. `systemctl start` on an already-active oneshot returns
          # without queueing another run, so starting while it is active would
          # silently leave this head to the timer: past the deadline, fail
          # instead. A run takes about three minutes.
          deadline=$((SECONDS + 600))
          while systemctl is-active --quiet review-dispatch.service; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::review-dispatch.service still active after 10 min; this head was not dispatched"
              exit 1
            fi
            sleep 5
          done
          systemctl start review-dispatch.service
          journalctl -u review-dispatch.service --since '-10min' --no-pager -o cat \
            | grep -E 'review-dispatch: |^  - |REV-' | tail -8 || true
