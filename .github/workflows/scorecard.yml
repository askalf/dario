# OpenSSF Scorecard — automated supply-chain security posture checks
# (branch protection, token permissions, pinned dependencies, CI tests, …).
# Results are published so the README badge and the public scorecard.dev API
# always reflect the current score; the SARIF also lands in code scanning.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '23 3 * * 1' # weekly (staggered per-repo)
  push:
    branches: [master]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
      # Never from a fork ON THE SCHEDULE. A forker's own push/PR runs are
      # left alone deliberately -- running security scanning on your own
      # copy is legitimate and must not be broken to save cron minutes.
      # See #1039.
    if: github.event_name != 'schedule' || github.repository == 'askalf/dario'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # upload the SARIF to code scanning
      id-token: write # required by publish_results (OIDC attestation)
    steps:
      - name: Checkout code
        uses: askalf/ci/actions/checkout-with-retry@f72ab57b941c7b578f85c45ff9e917e6efc7be02 # main 2026-10-23, askalf/ci#111
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Branch-Protection scores from what the job token can read: the public
          # rules of a public repo (5-8 of 10 here, not the -1 an earlier comment
          # claimed). A fine-grained PAT with `administration: read` + `metadata:
          # read` in the SCORECARD_TOKEN secret would also read the admin-only
          # settings; no repo sets one, so the fallback is the path every run takes.
          repo_token: ${{ secrets.SCORECARD_TOKEN || github.token }}
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@c35d1b164463ee62a100735382aaaa525c5d3496 # codeql-bundle-v2.25.6
        with:
          sarif_file: results.sarif
