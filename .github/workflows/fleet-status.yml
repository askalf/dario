# Posts fleet review-lane commit statuses for pull requests.
# Reads labels, comments, reviews and checks; writes statuses. Runs the default branch's script.
# Only the status job lives here, so every event this workflow fires on produces one check that
# runs. The script's tests are fleet-status-self-test.yml; the manual backfill over every open
# PR is fleet-status-backfill.yml.
# The script re-reads after posting and corrects what differs, so the last run to act leaves current
# statuses. Runs a workflow_run fires (one per finishing workflow, most of this workflow's runs) are
# grouped per PR branch and triggering event, and a newer one cancels an older (so a finished push
# run never cancels a pull request's). Their check runs sit on the default branch, not on the PR, so
# a cancelled one marks nothing on the PR. Every other event runs alone and is never cancelled. A
# pull_request or pull_request_review run's check run is on the PR, where a cancelled one rolls up
# as a failed check; an issue_comment run's sits on the default branch like a workflow_run's, and
# comments are few enough to leave each one its own run.
name: Fleet status

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted, edited, dismissed]
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: ['Fleet status self-test', 'Fleet review relay', CI, CodeQL, actionlint, 'Live test (self-hosted)', 'Compat test (self-hosted)',
                'Wire drift (self-hosted)', 'Overhead bench', 'Label PRs', 'Triage issues and PRs',
                'Bot PR version gate', 'Version bump advice', 'Spam removal', 'truecopy gate', Redline, Fuzz]
    types: [completed]

permissions: {}

concurrency:
  group: ${{ github.event_name == 'workflow_run' && format('fleet-status-{0}-{1}-{2}', github.event.workflow_run.event, github.event.workflow_run.head_repository.full_name, github.event.workflow_run.head_branch) || format('fleet-status-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'workflow_run' }}

jobs:
  status:
    # Constraint on every path, and why a fork PR may run here: no step checks out or executes
    # PR head code. The checkout is the default branch's script alone, and the script only calls
    # the REST API.
    # A fork PR runs only on events that run the default branch's workflow with a write token:
    # issue_comment, and workflow_run after a fork run of a listed workflow (its CI, or
    # 'Fleet review relay' for a review). A fork's pull_request and pull_request_review events run
    # the PR merge ref's workflow with a read-only token, so they never run this job.
    # A fork's workflow_run lists no pull requests; the script finds them by head repo and branch.
    # issue_comment fires for issues too; only PR comments matter. The script re-checks it.
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null) ||
      (github.event_name == 'workflow_run' &&
       ((contains(fromJSON('["pull_request","pull_request_target"]'), github.event.workflow_run.event) &&
         github.event.workflow_run.head_repository.full_name == github.repository &&
         github.event.workflow_run.pull_requests[0] != null) ||
        (contains(fromJSON('["pull_request","pull_request_target","pull_request_review"]'), github.event.workflow_run.event) &&
         github.event.workflow_run.head_repository.full_name != github.repository))) ||
      (github.event_name != 'issue_comment' && github.event_name != 'workflow_run' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    # On our runner for every event here, a fork PR's included: the job runs the default branch's
    # script and never PR code (see above), so GitHub's hosted queue going down does not hold the
    # fleet/verify and fleet/review statuses a merge waits on. A fork repository has no dario-exec
    # runners, so there it runs on GitHub's.
    runs-on: ${{ github.repository == 'askalf/dario' && fromJSON('["self-hosted","dario-exec"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
      checks: read
      statuses: write
    steps:
      - uses: askalf/checkout-with-retry@115a6407547e9711edbc2e915838d495cad9583f  # v1.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts/fleet-status.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Post the lane statuses
        if: hashFiles('scripts/fleet-status.mjs') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/fleet-status.mjs
