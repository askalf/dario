# Posts fleet review-lane commit statuses for pull requests.
# Reads labels, comments and reviews; writes statuses. Every event runs the default branch's
# copy of the script, so one set of rules computes a head's statuses whichever event fired.
name: Fleet status

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]
  issue_comment:
    types: [created, edited]

permissions: {}

concurrency:
  group: fleet-status-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  status:
    # Fork PRs are not reviewed by the fleet, and their events carry a read-only token anyway.
    # issue_comment fires for issues too; only PR comments matter. The script re-checks both.
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null) ||
      (github.event_name != 'issue_comment' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
      statuses: write
    steps:
      - uses: askalf/checkout-with-retry@115a6407547e9711edbc2e915838d495cad9583f  # v1.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts/fleet-status.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Post the lane statuses
        # Absent only until the script first lands on the default branch.
        if: hashFiles('scripts/fleet-status.mjs') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/fleet-status.mjs
