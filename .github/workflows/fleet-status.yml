# Posts fleet review-lane commit statuses for pull requests.
# Reads labels, comments, reviews and checks; writes statuses. Runs the default branch's script.
# Only the status job lives here, so every event this workflow fires on produces one check that
# runs. The script's tests are fleet-status-self-test.yml; the manual backfill over every open
# PR is fleet-status-backfill.yml.
# No concurrency group: a cancelled run rolls up as a failed check on the PR. The script
# re-reads after posting and corrects what differs, so the last run to act leaves current statuses.
name: Fleet status

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted, edited, dismissed]
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: ['Fleet status self-test', CI, CodeQL, actionlint, 'Live test (self-hosted)', 'Compat test (self-hosted)',
                'Wire drift (self-hosted)', 'Overhead bench', 'Label PRs', 'Triage issues and PRs',
                'Bot PR version gate', 'Version bump advice', 'Spam removal', Redline, Fuzz]
    types: [completed]

permissions: {}

jobs:
  status:
    # Fork PRs are not reviewed by the fleet, and their events carry a read-only token anyway.
    # issue_comment fires for issues too; only PR comments matter. The script re-checks both.
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null) ||
      (github.event_name == 'workflow_run' &&
       contains(fromJSON('["pull_request","pull_request_target"]'), github.event.workflow_run.event) &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.pull_requests[0] != null) ||
      (github.event_name != 'issue_comment' && github.event_name != 'workflow_run' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
      checks: read
      statuses: write
    steps:
      - uses: askalf/checkout-with-retry@115a6407547e9711edbc2e915838d495cad9583f  # v1.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts/fleet-status.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Post the lane statuses
        if: hashFiles('scripts/fleet-status.mjs') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/fleet-status.mjs
