name: actionlint

# Validates GitHub Actions workflow YAML against actionlint's rule set.
# Catches interpolation/quoting bugs, bad `needs:` refs, shell-quoting,
# and untrusted-input-in-run-script injection patterns.
#
# Runs on every PR + every push to master, no path filter. `actionlint`
# is a required status check in branch protection (added 2026-04-23).
# Path-filtered required checks can never report on PRs that don't touch
# the filtered paths, which leaves merges permanently blocked — found
# this in practice when PR #130 (src-only) hit indefinite BLOCK state.
# Same fix already in place on claude-bridge + deepdive. 30s of CI per
# unrelated PR is cheaper than the footgun.

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  actionlint:
    # Our own code (pushes, same-repo PRs, schedules, dispatches) runs on dario-exec, our
    # non-root one-job runners, so GitHub's hosted queue going down does not hold our PRs. A
    # fork's PR and a Dependabot PR run code nobody here wrote, and a fork repository has no
    # dario-exec runners, so those stay on GitHub's runners.
    runs-on: ${{ (github.repository != 'askalf/dario' || github.event.pull_request && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]')) && 'ubuntu-latest' || fromJSON('["self-hosted","dario-exec"]') }}
    timeout-minutes: 5
    steps:
      - uses: askalf/checkout-with-retry@115a6407547e9711edbc2e915838d495cad9583f  # v1.1.0

      - name: Install actionlint v1.7.1
        # Official release tarball, pinned to a specific version. Skipping
        # SHA256 verification here because actionlint is a CI-only lint
        # artifact that never ships to users — the supply-chain risk is
        # a broken build, not a compromised runtime. If this becomes a
        # required check, revisit with a pinned checksum.
        run: |
          set -euo pipefail
          curl -fsSL -o actionlint.tgz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.1/actionlint_1.7.1_linux_amd64.tar.gz
          tar xzf actionlint.tgz actionlint
          chmod +x actionlint
          ./actionlint -version

      # actionlint lints run: blocks with shellcheck only when shellcheck is on PATH, and skips it
      # silently otherwise. GitHub's image ships it; our runner's host does not, so the job brings
      # a pinned, checksummed copy wherever it runs.
      - name: Install shellcheck v0.10.0
        run: |
          set -euo pipefail
          curl -fsSL -o shellcheck.tar.xz             https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz
          echo "6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87  shellcheck.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/shellcheck"
          tar xJf shellcheck.tar.xz -C "$RUNNER_TEMP/shellcheck" --strip-components=1 shellcheck-v0.10.0/shellcheck
          rm shellcheck.tar.xz
          echo "$RUNNER_TEMP/shellcheck" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/shellcheck/shellcheck" --version

      - name: Run actionlint
        # -color for readable logs; default shellcheck integration is on,
        # which is what catches the run: block issues we actually care about.
        run: ./actionlint -color
