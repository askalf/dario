# Fuzzing of dario's parsers and translators with Jazzer.js (libFuzzer): every target in ./fuzz runs
# for FUZZ_SECONDS against a corpus that persists between runs through the Actions cache. A
# crash, an uncaught throw or a timeout fails the job and the reproducing input is uploaded as
# an artifact. This workflow is the fuzzer; cflite.yml is only the coverage report, because
# ClusterFuzzLite's action cannot fuzz JavaScript at all: it rejects every sanitizer for JS,
# rejects `none`, and `coverage` selects its report runner (proven 2026-09-26 on plumbline runs
# 36204398437 and 36204619235). Weekly, on demand, and on every pull request with a short budget:
# the job is a required check, and a required check that does not report blocks the merge, so
# it runs on every pull request and skips the fuzzing itself (reporting green) when no target or
# code under a target changed.
name: Fuzz

on:
  schedule:
    - cron: '23 6 * * 2' # weekly, Tuesday 06:23 UTC, after the coverage report's slot
  workflow_dispatch:
    inputs:
      seconds:
        description: 'Seconds per target'
        required: false
        default: '300'
  pull_request:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz (Jazzer.js)
    # Never from a fork: the schedule is inherited by every fork and means nothing there.
    if: github.repository == 'askalf/dario'
    runs-on: ubuntu-latest
    # A pull request fuzzes 60 s per target and finishes in under 5 min; the weekly run gets 300 s.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 15 || 40 }}
    steps:
      - uses: askalf/ci/actions/checkout-with-retry@45d88862287da7afb60c116f85b1ff9c341df1a0 # main 2026-10-21, askalf/ci#87
        with:
          persist-credentials: false
      # Which paths the pull request touches, against its base commit. The diff is between the
      # two commits rather than from the merge base, so a branch behind master may list master's
      # own changes too: that can only fuzz more often, never less. Rename detection is off so a
      # move lists both its source and its destination, and a file moved out of a watched
      # directory still counts.
      - name: Scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "not a pull request: every target runs"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          changed=$(git diff --no-renames --name-only "$BASE_SHA" HEAD)
          relevant=$(echo "$changed" | grep -E '^(fuzz/|src/|package\.json$|package-lock\.json$|\.clusterfuzzlite/package\.json$|\.github/workflows/fuzz\.yml$)' || true)
          if [ -n "$relevant" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "fuzz-relevant paths changed:"
            echo "$relevant" | while IFS= read -r f; do echo "  $f"; done
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "no fuzz target, source or package file changed; the fuzzing is skipped and this check reports green"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: 22
      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: npm ci --no-audit --no-fund
      - name: Install the fuzz build dependencies (Jazzer.js)
        if: steps.scope.outputs.run == 'true'
        run: npm ci --prefix .clusterfuzzlite --no-audit --no-fund
      - name: Build (the targets import dist/)
        if: steps.scope.outputs.run == 'true'
        run: npm run build
      # The newest saved corpus, whichever run saved it; the save below writes a fresh key each
      # run so the restore-keys prefix always finds the latest.
      - name: Restore the corpus
        if: steps.scope.outputs.run == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Fuzz every target
        if: steps.scope.outputs.run == 'true'
        env:
          FUZZ_SECONDS: ${{ github.event_name == 'pull_request' && '60' || inputs.seconds || '300' }}
          FUZZ_CORPUS_DIR: fuzz/corpus
          FUZZ_ARTIFACT_DIR: fuzz/crashes
        run: node fuzz/run.mjs
      - name: Upload the crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes-${{ github.run_id }}
          path: fuzz/crashes
          if-no-files-found: ignore
      # Only runs on the default branch feed the shared corpus; a pull request's cache is scoped
      # to its branch anyway.
      - name: Save the corpus
        if: always() && github.event_name != 'pull_request' && steps.scope.outputs.run == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
