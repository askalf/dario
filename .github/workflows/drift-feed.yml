name: GitHub Pages (the site and the wire-drift feed)

# Publishes askalf.github.io/dario: the landing page (site/, with the README
# art and the brand font next to it), the per-tool pages under /tools/
# (generated from docs/tools.md by scripts/site-tools.mjs) and, under
# /drift-feed/, every change to
# what Claude Code sends on the wire as the template watcher observed it. The
# feed is built from git history alone (scripts/drift-feed.mjs walks the
# commits that touched src/cc-template-data.json), so there is nothing to
# commit: a template rebake lands on master, this rebuilds and redeploys.
# One job builds both, because a Pages deploy replaces the whole site: a
# second workflow deploying only one of them would wipe the other.
#
# Runs on every master push that touches the page, the art, the template or
# the generator, once a day as a backstop, and on demand. Never from a fork
# (see #1039). test/site.mjs checks that the page's links resolve to what
# this job ships.

on:
  push:
    branches: [master]
    paths:
      - site/**
      - docs/tools.md
      - scripts/site-tools.mjs
      - .github/readme/**
      - scripts/readme/fonts/**
      - src/cc-template-data.json
      - scripts/drift-feed.mjs
      - .github/workflows/drift-feed.yml
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drift-feed-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'askalf/dario'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: askalf/ci/actions/checkout-with-retry@e6a0901235a1d880cf620d23eece2ba63bd042f9 # main 2026-10-25, askalf/ci#135
        with:
          # The feed IS the history: every commit that touched the template.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build the site and the feed
        run: |
          node scripts/drift-feed.mjs --out dist-feed/drift-feed --site "https://askalf.github.io/dario/drift-feed"
          # The Pages root is the landing page; it references the README art
          # as art/<file> and the brand font as fonts/<file>. The per-tool
          # pages under tools/ are generated from docs/tools.md.
          cp -r site/. dist-feed/
          node scripts/site-tools.mjs --out dist-feed/tools --site "https://askalf.github.io/dario"
          mkdir -p dist-feed/art dist-feed/fonts
          cp .github/readme/*.jpg .github/readme/*.png dist-feed/art/
          cp scripts/readme/fonts/*.woff2 dist-feed/fonts/
          touch dist-feed/.nojekyll
          ls -la dist-feed dist-feed/art dist-feed/fonts
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist-feed

  deploy:
    needs: build
    if: github.repository == 'askalf/dario'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      # configure-pages' enablement reads the repo to create the site.
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Creates the Pages site on first run (source: GitHub Actions). The
      # workflow token cannot do this until an org admin enables Pages for
      # this repo once via Settings > Pages (site creation needs an
      # administration-scoped token that neither GITHUB_TOKEN nor our PAT
      # holds — see intervention 00MTXRXWUE8B4B8911FAAF62BC). Until then,
      # skip deploy instead of hard-failing every master push/schedule.
      - id: configure
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true
        continue-on-error: true
      - name: Warn if Pages site is not yet enabled
        if: steps.configure.outcome != 'success'
        run: |
          echo "::warning::GitHub Pages site for askalf/dario does not exist and could not be created by the Actions token. An org admin must enable Pages once via Settings > Pages (source: GitHub Actions). Skipping deploy until then."
      - id: deployment
        if: steps.configure.outcome == 'success'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
