name: Wire drift (self-hosted)

# Runs `node scripts/check-wire-drift.mjs` against the installed `claude` on
# the self-hosted runner. This is the RUNTIME counterpart to cc-drift-watch.yml
# (which statically scans the installed Claude Code package and so can't see
# per-request wire decisions): it spawns claude for opus/sonnet/haiku/fable,
# reading each anthropic-beta header + billing block, and fails if
#
#   - betaForModel no longer reproduces CC's per-model beta set (the 2.1.170 ->
#     2.1.199 drift that shipped silently: sonnet keeping mid-conversation-
#     system, haiku dropping afk-mode + reordering, fable/[1m] positions), or
#   - dario's cch gate disagrees with CC's billing block (CC emits a cch we
#     have no seed for, or we hold a seed for a version CC no longer stamps).
#
# Mechanism: spawn the installed `claude` against a loopback endpoint (stub
# key, no OAuth) and read the request it sends — no real Anthropic call, so
# this needs only `claude` on PATH, not a subscription. The `dario-drift`
# runner already has claude installed (it hosts the template drift watcher).
# GH-hosted runners have no claude, so they can't host this.
#
# Trusted events only. This job pins the runner's OAuth credential into place and runs as
# root on the production host, so it never executes code from a pull request (a same-repo PR
# would run as root with that credential in reach). It runs on pushes to master that touch the
# wire surface, hourly, and on dispatch; a failing run opens or updates the `cc-drift` issue and a
# clean run closes it. PR-time coverage of the wire surface comes from the unit suite and the
# non-root live-test.
#
# A drift with a mechanical fix gets a PR from this job: Claude Code stopped sending, on a model
# family, a beta the opus base carries (scripts/wire-drift-fix.mjs). The platform review gate holds
# template rebakes while the issue is open, so the fix is what lets a rebake release.
on:
  push:
    branches: [master]
    paths:
      # The wire-shape surface this check guards.
      - 'src/proxy.ts'
      - 'src/beta-family-drops.ts'
      - 'src/cch.ts'
      - 'src/cc-template.ts'
      - 'src/cc-template-data.json'
      - 'scripts/check-wire-drift.mjs'
      - '.github/workflows/wire-drift-self-hosted.yml'
  schedule:
    # Hourly at :11. Catches a new claude on the runner (a different per-model beta set) within the
    # hour, as the template watcher at :41 catches a new prompt, so the fix PR opens before a
    # rebake waits long on it. :11 is a minute no other dario-drift workflow uses. The check
    # spawns claude against a loopback stub and makes no upstream call.
    - cron: '11 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wire-drift-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  wire-drift:
    permissions:
      contents: write       # push the bot/wire-drift-fix-* branch
      issues: write
      pull-requests: write  # open the fix PR
    # Never from a fork. This job is meaningless anywhere but this
    # repository, and 54 forks inherit the schedule. See #1039.
    if: github.repository == 'askalf/dario'
    runs-on: [self-hosted, dario-drift]
    timeout-minutes: 10
    steps:
      - uses: askalf/checkout-with-retry@115a6407547e9711edbc2e915838d495cad9583f  # v1.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22

      - name: Install + build
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Pin OAuth credential to platform-dario canonical
        # This job spawns `claude` on the box, and `claude` shares
        # /root/.claude/.credentials.json with the platform dario container.
        # Every OTHER self-hosted workflow that runs CC re-pins that path to the
        # container's canonical store first; this one did not. Two files in one
        # refresh-token family rotate each other to death via Anthropic's
        # reuse detection — that is the 2026-06-23 fleet outage.
        #
        # The split is neither hypothetical nor a one-off: found again on
        # 2026-08-25 (a REGULAR file at inode 290627 beside canonical 290583),
        # alongside saved stubs from 2026-07-17, 07-18 and 08-02. Notably the
        # clobbering file is an EMPTIED credential — accessToken "",
        # refreshToken "", expiresAt 0, scopes intact — so something writes a
        # blank credential on auth failure rather than CC refreshing over the
        # link, which is what the runbook had assumed. Whatever the writer is,
        # re-pinning before use is the cheap guard, and it is exactly what
        # cc-billing-classifier-canary.yml and cc-drift-template-watch.yml
        # already do.
        run: |
          CANON=/var/lib/askalf-dario/credentials.json
          if [ -e "$CANON" ]; then
            mkdir -p /root/.claude /root/.dario
            ln -sfn "$CANON" /root/.claude/.credentials.json
            ln -sfn "$CANON" /root/.dario/credentials.json
            echo "pinned runner OAuth credential -> $CANON (inode $(stat -L -c %i "$CANON"))"
          else
            echo "::warning::canonical $CANON missing — platform dario down? proceeding as-is"
          fi

      - name: Resolve the CC binary this check measures
        # actions/setup-node prepends the runner's tool-cache Node bin dir to
        # PATH, and that Node carries its own global install. On 2026-09-22 the
        # tool-cache copy was still 2.1.278 (installed 09-19) while the system
        # /usr/bin/claude was 2.1.280, so this check spent four runs comparing
        # the bundle against a CC nobody deploys and reported drift on a label
        # refresh that was correct. The system binary is the one the box, the
        # bake and the platform container use, so name it explicitly rather
        # than let PATH order decide which CC the drift check measures.
        run: |
          SYS=/usr/bin/claude
          if [ -x "$SYS" ]; then
            echo "DARIO_CLAUDE_BIN=$SYS" >> "$GITHUB_ENV"
          else
            echo "::warning::$SYS missing — falling back to PATH resolution"
          fi

      - name: Report claude version
        run: |
          BIN="${DARIO_CLAUDE_BIN:-claude}"
          echo "using $BIN ($(readlink -f "$BIN" 2>/dev/null || echo 'not a link'))"
          "$BIN" --version || echo "::warning::claude not runnable — the wire-drift check will report a high-severity 'capture' finding"

      - name: Run wire-drift check
        id: drift
        run: |
          set +e
          node scripts/check-wire-drift.mjs > wire-drift-report.json 2> wire-drift-log.txt
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          echo "=== wire-drift-log.txt ==="
          cat wire-drift-log.txt
          echo "=== wire-drift-report.json ==="
          cat wire-drift-report.json

      - name: Fix a beta that a family stopped sending
        # The one wire-drift class with a mechanical fix: on a model family, Claude Code does not
        # send a beta the opus base carries, and the rest of that family's set matches in order.
        # scripts/wire-drift-fix.mjs adds the flag to the family's list in src/beta-family-drops.ts.
        # The check above then runs again on the rebuilt code, with every unit test that reads
        # betaForModel, and the PR opens only when all pass: a fix that changes a recorded capture's
        # expected set is a person's. Anything else stays in the drift issue for a person. One fix
        # PR at a time: while one is open, the next run leaves it to land.
        if: steps.drift.outputs.exit_code != '0'
        id: fix
        env:
          # A PR opened with the job's own token starts no workflows, so CI and the review would
          # never run on it. Same token choice as the template watcher's rebake PR.
          GH_TOKEN: ${{ secrets.DARIO_DRIFT_BOT_PAT || secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eo pipefail
          open=$(gh pr list --state open --limit 100 --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("bot/wire-drift-fix-"))] | length')
          if [ "$open" != 0 ]; then
            echo "a wire-drift fix PR is already open; leaving it to land"
            exit 0
          fi
          set +e
          node scripts/wire-drift-fix.mjs wire-drift-report.json > wire-drift-fix.json
          code=$?
          set -e
          cat wire-drift-fix.json
          if [ "$code" = 3 ]; then
            echo "no mechanical fix; the drift issue carries it"
            exit 0
          fi
          if [ "$code" != 0 ]; then
            echo "::warning title=wire-drift fix not attempted::scripts/wire-drift-fix.mjs exited $code"
            exit 0
          fi
          npm run build
          set +e
          node scripts/check-wire-drift.mjs > wire-drift-recheck.json 2> wire-drift-recheck-log.txt
          recheck=$?
          matrix=0
          : > beta-tests.txt
          for t in beta-matrix fable-beta wire-drift-fix; do
            node "test/$t.mjs" >> beta-tests.txt 2>&1 || matrix=1
          done
          set -e
          if [ "$recheck" != 0 ] || [ "$matrix" != 0 ]; then
            echo "::warning title=wire-drift fix not opened::the patched betaForModel did not pass (re-check exit $recheck, beta tests failed: $matrix); the drift issue carries it"
            cat wire-drift-recheck.json beta-tests.txt || true
            git checkout -- src/beta-family-drops.ts CHANGELOG.md
            exit 0
          fi
          title=$(node -p "require('./wire-drift-fix.json').title")
          branch="bot/wire-drift-fix-$(date -u +%Y%m%d-%H%M%S)"
          git config user.email "actions@github.com"
          git config user.name "wire-drift-self-hosted[bot]"
          git checkout -b "$branch"
          git add src/beta-family-drops.ts CHANGELOG.md
          git commit -m "$title"
          git push origin "$branch"
          body=$(mktemp)
          {
            cat wire-drift-fix.md
            echo ""
            echo "### Validation"
            echo ""
            echo "On the patched, rebuilt code in the watcher's run: \`scripts/check-wire-drift.mjs\` against the installed Claude Code passes, and so do \`test/beta-matrix.mjs\`, \`test/fable-beta.mjs\` and \`test/wire-drift-fix.mjs\`. [Run]($RUN_URL)"
          } > "$body"
          gh label create wire-drift --color D93F0B \
            --description "Rebake opened while the wire-drift check was failing" \
            --force >/dev/null 2>&1 || true
          if ! pr_url=$(gh pr create --head "$branch" --base master --title "$title" --body-file "$body" --label wire-drift); then
            echo "::error title=wire-drift fix PR not opened::$branch is pushed, but gh pr create failed; the drift issue still records the drift"
            exit 1
          fi
          echo "opened $pr_url"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Open / update drift issue
        # There is no pull request to comment on, so every failing run (push, schedule or
        # dispatch) lands in the one drift issue. The watcher runs hourly, so a run whose findings
        # are already in the issue adds nothing unless it opened a fix PR. It runs whatever the fix
        # step did: the template watcher's rebakes wait on this issue, so a failed repair must
        # never keep the drift from being filed. An empty exit code means the check never ran.
        if: always() && steps.drift.outputs.exit_code != '' && steps.drift.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIX_PR: ${{ steps.fix.outputs.pr_url }}
        run: |
          # The report file starts with the in-process proxy's banner (scripts/check-wire-drift.mjs
          # shares stdout with it); the JSON begins at the first line that is a brace. Parsing from
          # there is what keeps the title's version real instead of "vunknown" (#1424).
          CC_VERSION=$(node -e "try{const t=require('fs').readFileSync('wire-drift-report.json','utf-8');const i=t.search(/^\{/m);console.log(JSON.parse(t.slice(i<0?0:i)).ccVersion||'unknown')}catch(e){console.log('unknown')}")
          TITLE="Wire drift detected: CC v${CC_VERSION}"
          EXISTING=$(gh issue list --label cc-drift --state open --search "in:title \"${TITLE}\"" --json number --jq '.[0].number')
          SIG=$(node -e "try{const t=require('fs').readFileSync('wire-drift-report.json','utf-8');const i=t.search(/^\{/m);const f=JSON.parse(t.slice(i<0?0:i)).findings||[];console.log(require('crypto').createHash('sha256').update(JSON.stringify(f)).digest('hex').slice(0,16))}catch(e){console.log('unread')}")
          MARKER="<!-- wire-drift-findings:${SIG} -->"
          if [ -n "$EXISTING" ] && [ -z "$FIX_PR" ] && [ "$SIG" != unread ] \
            && gh issue view "$EXISTING" --json body,comments --jq '[.body] + [.comments[].body] | join("\n")' | grep -qF "$MARKER"; then
            echo "#$EXISTING already carries these findings"
            exit 0
          fi
          body_file=$(mktemp)
          {
            echo "\`scripts/check-wire-drift.mjs\` found a per-model beta or cch-gate divergence from the installed \`claude\` (CC v${CC_VERSION})."
            echo ""
            echo '```json'
            cat wire-drift-report.json 2>/dev/null || echo "(no report)"
            echo '```'
            echo ""
            echo "Fix: update \`betaForModel\` (src/proxy.ts) to the current CC matrix, and/or run \`npm run cch:calibrate\` if the report shows a cch-gate finding. [Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            if [ -n "$FIX_PR" ]; then
              echo ""
              echo "The watcher opened a fix for this: $FIX_PR. This issue closes on the first clean run after it merges."
            fi
            echo ""
            echo "$MARKER"
          } > "$body_file"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file "$body_file"
          else
            gh issue create --title "$TITLE" --body-file "$body_file" --label cc-drift
          fi

      - name: Close drift issues on a clean run
        # Every other watcher self-reaps; this one never did, so an issue outlived the drift it
        # reported (#1424 stayed open after #1426 fixed it).
        if: steps.drift.outputs.exit_code == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue list --label cc-drift --state open --limit 100 --search 'in:title "Wire drift detected"' \
            --json number --jq '.[].number' \
          | while read -r n; do
              [ -n "$n" ] || continue
              gh issue close "$n" --comment "Closed by the wire-drift watcher: the run at $RUN_URL found no drift against the installed CC."
            done

      - name: Set job status
        # The drift verdict decides the job. A failed fix step only runs on drift, so the job is
        # already failing then; it is named here so the run's summary shows it beside the drift.
        if: always()
        env:
          DRIFT_EXIT_CODE: ${{ steps.drift.outputs.exit_code }}
          FIX_OUTCOME: ${{ steps.fix.outcome }}
        run: |
          if [ "$FIX_OUTCOME" = failure ]; then
            echo "::error title=wire-drift fix step failed::see the fix step's log; the drift issue step ran regardless"
          fi
          exit "${DRIFT_EXIT_CODE:-1}"
