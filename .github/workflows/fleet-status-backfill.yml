# Manual: posts the fleet review-lane statuses on every open same-repo PR. Run it right after
# the fleet/* contexts become required checks, so PRs opened before that report.
name: Fleet status backfill

on:
  workflow_dispatch:

permissions: {}

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
      checks: read
      statuses: write
    steps:
      - uses: askalf/ci/actions/fleet-status@083d15618782a9884ab24da3afd3ddfed1a0187a # main 2026-10-27, askalf/ci#137
        with:
          all-open: 'true'
