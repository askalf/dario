name: Compat test (self-hosted)

# Runs `node test/compat.mjs` against a live `dario proxy --passthrough`
# instance on the same self-hosted runner that hosts the drift watcher.
# Catches wire-shape regressions BEFORE merge instead of relying on the
# post-release drift watcher to flag them after the fact.
#
# The compat suite is the only test in the repo that exercises dario as a
# full HTTP service against real Anthropic — it sends ~11 small requests
# through the proxy and verifies streaming framing, tool use, OpenAI-compat
# shape, header pass-through, no thinking-injection in passthrough mode,
# and client-beta preservation. ~10–20s of wall time, ~11 subscription
# requests per run.
#
# Github-hosted runners can't host this: they have no Pro/Max subscription
# session, no OAuth credential, no way to authenticate against
# api.anthropic.com. The runner labeled `dario-drift` already has all of
# the above (set up for the v4.2.2 template drift watcher; the same
# credential file authenticates both).
#
# Triggered only on PRs that touch the wire-shape surface — the proxy
# entrypoint, the request template, streaming code paths, the bundled
# template JSON, or compat.mjs itself. Other PRs (docs, CI, unrelated
# tests) skip this job entirely to keep runner cycles and subscription
# requests low.
#
# Fork PRs are skipped — a self-hosted runner with credentials must never
# execute arbitrary code from forks.

on:
  pull_request:
    paths:
      # Source — any change under src/ (was narrow file list pre-2026-05-23
      # which missed PRs touching src/doctor*.ts, src/runner*.ts, src/cli.ts,
      # src/cc-drift*.ts, etc.; those are exactly the kind of change compat
      # is supposed to validate).
      - 'src/**'
      # package.json — covers maxTested version bumps. Every release PR
      # (v4.8.5 .. v4.8.9) is essentially "I tested this against the new
      # claude-code version" and compat IS that test. Pre-2026-05-23 the
      # filter excluded them; 5 release PRs shipped uncovered in that gap.
      - 'package.json'
      # Test surface + capture infrastructure
      - 'scripts/capture-and-bake.mjs'
      - 'test/compat.mjs'
      - '.github/workflows/compat-test-self-hosted.yml'
  workflow_dispatch:

permissions:
  contents: read

# Single-flight across the whole repo, not per-ref. Two PRs landing in
# the same hour both run compat, both make real Anthropic calls, and
# the second one hits the rate-limit-window cap accumulated by the
# first. The per-ref concurrency this replaced still let cross-PR runs
# stack. Global group + queue (cancel-in-progress: false) serializes
# them so the shared subscription window has time to recover between
# runs. Tradeoff: a PR may wait a few minutes if another compat run is
# in-flight. Acceptable for unattended bot-PR cycles which are the
# main consumer of this workflow in maintenance mode.
concurrency:
  group: compat-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  compat:
    permissions:
      contents: read
      pull-requests: write
    # Fork-PR guard: only the source repo can run on the self-hosted runner.
    # `workflow_dispatch` always runs (maintainer-triggered).
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, dario-drift]
    timeout-minutes: 10
    # Promote the API-key secret into job-level env so step-level `if:`
    # conditions can read it. GitHub Actions disallows `secrets.X` inside
    # `if:` expressions (only env/github/inputs/job/etc. are allowed),
    # so we surface it as an env var first. Empty string when unset.
    env:
      COMPAT_API_KEY: ${{ secrets.ANTHROPIC_COMPAT_API_KEY }}
    steps:
      - uses: askalf/checkout-with-retry@115a6407547e9711edbc2e915838d495cad9583f  # v1.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22

      - name: Install + build
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Bring the runner's CC up to the maxTested claim
        # Close the lag INSTEAD of reporting it.
        #
        # cc-drift-watch.yml drafts a `maxTested` bump from the npm registry's
        # @latest, but the runner only moves to @latest once a day when
        # cc-autoupdate.timer fires (~04:58Z). Any drift PR drafted before that
        # tick claims a CC version the runner cannot load, so the gate below
        # fails closed and the PR sits red until a human upgrades the box by
        # hand. That is not a rare edge: it burned two operator approvals and
        # dario#1113 in a single day, and each time the resolution was to run
        # the very command this step now runs.
        #
        # DELIBERATE SHAPE:
        #   * UPGRADE ONLY, never downgrade. A PR that LOWERS maxTested must not
        #     drag this shared runner backwards -- cc-drift-template-watch and
        #     the billing canary capture from the same binary, and pinning them
        #     to an older CC to satisfy one PR would corrupt their baselines.
        #   * The version is validated as strict X.Y.Z before it reaches npm.
        #     It comes from the PR's own source, and this runner is credentialed.
        #     (Fork PRs cannot reach here -- the job-level guard requires
        #     head.repo.full_name == github.repository -- but defence in depth.)
        #   * NOT fatal on failure. If npm cannot serve that version, say so and
        #     continue: the maxTested gate in the next step is still the
        #     authority and will fail closed with its existing message. This
        #     step only ever removes a reason to fail; it must never invent one.
        #   * The capture in the next step is `force: true`, so it re-reads the
        #     template from whatever CC is installed after this runs -- which is
        #     exactly the self-healing path dario#1014 built.
        run: |
          set -uo pipefail
          claimed="$(node -e 'import("./dist/live-fingerprint.js").then(m=>process.stdout.write(String(m.SUPPORTED_CC_RANGE.maxTested||"")))' 2>/dev/null || true)"
          installed="$(claude --version 2>/dev/null | awk '{print $1}' || true)"
          echo "claimed maxTested=${claimed:-<unreadable>} installed CC=${installed:-<none>}"

          if [ -z "$claimed" ] || [ -z "$installed" ]; then
            echo "::notice::cannot compare versions — leaving the runner alone; the maxTested gate still decides"
            exit 0
          fi
          case "$claimed" in
            *[!0-9.]*|""|.*|*.) echo "::notice::maxTested is not a bare X.Y.Z ($claimed) — not touching npm"; exit 0 ;;
          esac
          if [ "$(printf '%s\n%s\n' "$claimed" "$installed" | sort -V | tail -1)" = "$installed" ]; then
            echo "runner already at or ahead of the claim — nothing to do"
            exit 0
          fi

          echo "upgrading CC $installed -> $claimed so the claim can actually be exercised"
          if npm i -g "@anthropic-ai/claude-code@${claimed}" >/dev/null 2>&1; then
            now="$(claude --version 2>/dev/null | awk '{print $1}' || true)"
            echo "runner CC now: ${now:-<unreadable>}"
            [ "$now" = "$claimed" ] || echo "::warning::upgrade ran but version reads ${now:-<unreadable>}; the gate below will decide"
          else
            echo "::warning::npm could not install @anthropic-ai/claude-code@${claimed} (unpublished or registry down) — the maxTested gate below will fail closed with the actionable message"
          fi

      - name: Start dario proxy (passthrough mode)
        # Always start dario: the suite routes THROUGH the proxy so the
        # passthrough-verification + OpenAI-compat sections actually run (they
        # were skipped in the old direct-Anthropic mode). dario forwards
        # upstream with the per-token API key (ANTHROPIC_UPSTREAM_API_KEY)
        # instead of the Pro/Max OAuth bearer — and that is REQUIRED here, not a
        # rate-limit workaround. This job runs dario in --passthrough (to verify
        # the no-injection guarantee), so the outbound requests are NOT
        # CC-shaped, and the Max OAuth pool REJECTS non-CC-shaped traffic by
        # design: "429 Rate limited (rejected)" is the billing classifier, not a
        # volume cap. The per-token API pool has no such classifier. (Tested
        # 2026-06-08: routing this suite through dario->Max gave 9/10 rejections;
        # the earlier "~3/min cap" framing was a misdiagnosis.) Do NOT switch the
        # upstream back to OAuth — passthrough on the Max pool cannot work.
        #
        # OAuth credential: the previous v4.4.1 design pinned HOME to
        # /root/.claude-runner to isolate this workflow's OAuth from any
        # other CC client sharing /root/.claude/. In practice that meant
        # nothing kept the isolated token fresh between workflow fires
        # (each run lasts <10 min; the credential idled for hours);
        # access tokens expired, then refresh tokens also died of disuse
        # (Anthropic invalidates a refresh token if it sits unused too
        # long). Symptom: `invalid_grant` on every workflow run, with no
        # path to recovery short of an interactive `dario login --manual`.
        #
        # New design: share /root/.claude/.credentials.json with the
        # platform dario. The platform dario auto-refreshes the access
        # token on its own ~1h cycle, so the file is always fresh when
        # this workflow fires. That claim was FALSE for the background
        # refresh timer, which rotated the shared token and took the fleet
        # down on 2026-08-25 (#1103). The proxy now runs under an isolated
        # HOME (see the launch below) so it never loads that credential at
        # all — which is what finally makes "no rotation race" true.
        # docs/drift-monitor.md updated to match.
        #
        # --port=3457 (v4.6.1) avoids the platform's existing dario at
        # :3456 (askalf-dario docker container). Without this, dario's
        # "already running" detection short-circuits the workflow's own
        # startup and the test runs against the WRONG dario — the
        # platform's, not the PR's freshly-built one. DARIO_TEST_URL
        # is read by test/compat.mjs.
        env:
          DARIO_TEST_URL: http://127.0.0.1:3457
          # Forward upstream via the per-token API pool (x-api-key) instead of
          # the subscription OAuth. REQUIRED, not a ~3/min-rate workaround:
          # --passthrough requests aren't CC-shaped and the Max OAuth pool
          # rejects those ("429 Rate limited (rejected)"); the per-token pool has
          # no such classifier. See the Start-step comment above. Reuses the
          # existing per-token compat secret.
          ANTHROPIC_UPSTREAM_API_KEY: ${{ secrets.ANTHROPIC_COMPAT_API_KEY }}
        run: |
          # Force a fresh live capture BEFORE the proxy boots (dario#1014).
          #
          # cc-template.ts loads ~/.dario/cc-template.live.json SYNCHRONOUSLY at
          # module init, while the drift-triggered refresh is a background task
          # whose result only lands for the NEXT startup. So after a CC upgrade
          # on this runner, the first compat run reads the PREVIOUS version's
          # template, logs `⚠ template drift`, and passes anyway — validating a
          # wire shape that is not the one we are claiming support for. That is
          # how #1012 merged a `maxTested` bump to v2.1.235 whose only green
          # compat run had exercised v2.1.234's template.
          #
          # Capturing synchronously here makes the run self-healing: no manual
          # re-run needed after a CC bump, and no silent-stale window.
          node --input-type=module -e "
            const m = await import('./dist/live-fingerprint.js');
            const t = await m.refreshLiveFingerprintAsync({ force: true, silent: false });
            if (!t) {
              console.error('::error::live template capture failed — refusing to run compat against a possibly-stale template');
              process.exit(1);
            }
            console.log('[compat] captured live template from CC ' + t._version);

            // maxTested gate (dario#1014, second cause).
            //
            // The capture above fixes a STALE template. It does not fix the
            // other lag: cc-drift-watch.yml drafts a maxTested bump from the
            // npm registry's @latest, while this job runs against whatever CC
            // is installed on the runner. When npm is ahead of the box, a PR
            // claims support for a version nothing ever exercised — and compat
            // goes green anyway. That shipped twice (#1012 -> v2.1.235,
            // #1022 -> v2.1.236), both times caught only by a human reading
            // the log.
            //
            // A green compat that validated an OLDER CC than the PR claims is
            // worse than a red one: it is an affirmative 'we tested this'
            // on a version that was never loaded. Fail closed instead.
            const installed = t._version;
            const claimed = m.SUPPORTED_CC_RANGE.maxTested;
            if (m.compareVersions(installed, claimed) < 0) {
              console.error('::error::compat cannot validate maxTested=' + claimed +
                ' — the runner captured CC ' + installed + '. Upgrade CC on the runner' +
                ' (npm i -g @anthropic-ai/claude-code@' + claimed + ') and re-run, or lower maxTested.');
              process.exit(1);
            }
            console.log('[compat] maxTested gate ok: claimed ' + claimed + ' <= installed ' + installed);
          "

          # Background-start the proxy, capture PID for the always-run
          # teardown step. --passthrough disables the canonical wire-shape
          # rebuild path so compat.mjs can verify dario forwards the
          # client's exact request shape (the explicit guarantee
          # passthrough mode makes).
          #
          # --strict-template is the backstop to the capture above: if the
          # template is still drifted or fell back to the bundled snapshot,
          # the proxy refuses to boot rather than serving a stale shape. A
          # compat run that passes against the wrong template is a worse
          # signal than one that fails — it reports all-clear on data that
          # does not describe the version under test.
          # CREDENTIAL ISOLATION (2026-08-25 fleet outage). This job forwards
          # upstream with ANTHROPIC_UPSTREAM_API_KEY and does not need the
          # Claude OAuth pool at all — but dario loads that pool and arms its
          # background REFRESH timer at startup regardless of routing target.
          # The credential it loaded was the SHARED /root/.claude/.credentials
          # .json, and Anthropic invalidates a refresh token the moment it is
          # used, so this proxy rotated the token out from under the platform
          # container, which then looped `invalid_grant` and stopped serving
          # the whole fleet (#1103) until it was hand-recovered.
          #
          # Fix: give the proxy its OWN empty HOME. It then materializes an
          # empty pool — a supported configuration when an upstream API key is
          # set (requiresClaudeLogin() returns false for exactly this case) —
          # and every request still goes out with x-api-key, which is what this
          # job tests anyway. Note --no-claude-auth is NOT the right tool here
          # despite its name: it makes Claude-bound requests return an
          # unauthenticated error, which would break the suite's own traffic.
          ISO_HOME="${RUNNER_TEMP:-/tmp}/dario-compat-home"
          rm -rf "$ISO_HOME"
          mkdir -p "$ISO_HOME/.dario"
          # --strict-template reads ~/.dario/cc-template.live.json, which the
          # capture step above wrote into the REAL home. Copy it across (never
          # move — that file belongs to the box), or the proxy refuses to boot.
          cp "$HOME/.dario/cc-template.live.json" "$ISO_HOME/.dario/" 2>/dev/null || true
          HOME="$ISO_HOME" node dist/cli.js proxy --passthrough --strict-template --port=3457 > proxy.log 2>&1 &
          echo $! > proxy.pid
          echo "started dario proxy with PID $(cat proxy.pid)"

          # Wait up to 30s for /health to respond 200 before running tests.
          # Bail with the proxy log if it never comes up.
          ready=false
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null --max-time 2 http://127.0.0.1:3457/health; then
              ready=true
              echo "proxy ready after ${i}s"
              break
            fi
            sleep 1
          done
          if [ "$ready" != "true" ]; then
            echo "::error::dario proxy never reached /health within 30s"
            echo "=== proxy.log ==="
            cat proxy.log
            exit 1
          fi

      - name: Run compat tests
        id: compat
        # The suite routes THROUGH dario (DARIO_TEST_API_KEY intentionally
        # UNSET so compat.mjs hits the local proxy at DARIO_TEST_URL, not
        # api.anthropic.com directly). dario forwards upstream with the
        # per-token API key (set on the Start step above) — required because the
        # Max OAuth pool rejects the --passthrough (non-CC-shaped) requests with
        # "429 Rate limited (rejected)" (the billing classifier, not a volume
        # cap; the old "~3/min" framing was a misdiagnosis). This is what makes
        # the passthrough-verification + OpenAI-compat sections run instead of
        # skip. See docs/recovery.md "Compat suite 429s".
        env:
          DARIO_TEST_URL: http://127.0.0.1:3457
        run: |
          set +e
          # `node test/compat.mjs | tee` — without pipefail, `$?` captures
          # `tee`'s exit (always 0), NOT compat.mjs's. v4.6.3 fix: use
          # ${PIPESTATUS[0]} (the leftmost command's exit code) so a
          # failing compat suite actually surfaces as a non-zero exit.
          # Pre-v4.6.3 this step always emitted `exit_code=0`, which let
          # the workflow's job status finalizer mark the run SUCCESS even
          # when 9/10 compat assertions failed. Caught by hand on the
          # v4.6.2 follow-up run (#26003543366).
          node test/compat.mjs | tee compat-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Stop dario proxy
        # Unconditional always(): the old `&& env.COMPAT_API_KEY == ''`
        # guard meant teardown NEVER fired once the secret was set,
        # leaking the proxy on :3457 — exactly the stale-binary hazard
        # the Start step warns about. Safe when nothing started:
        # proxy.pid absent → the kill block is skipped, and every
        # kill/tail is `|| true`-guarded.
        if: always()
        run: |
          if [ -f proxy.pid ]; then
            pid=$(cat proxy.pid)
            kill "$pid" 2>/dev/null || true
            # Give it 2s for graceful shutdown, then SIGKILL.
            for _ in 1 2; do
              sleep 1
              kill -0 "$pid" 2>/dev/null || break
            done
            kill -9 "$pid" 2>/dev/null || true
            rm -f proxy.pid
          fi
          echo "=== proxy.log tail ==="
          tail -80 proxy.log 2>/dev/null || true

      - name: Comment on PR with result
        if: github.event_name == 'pull_request' && always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # De-dup: replace previous compat-test comment from this bot on
          # the same PR rather than stacking comments per push. Marker
          # comment is recognized by the `<!-- dario-compat-test -->`
          # HTML comment baked into the body.
          pr=${{ github.event.pull_request.number }}
          marker='<!-- dario-compat-test -->'
          existing=$(gh api "repos/${{ github.repository }}/issues/$pr/comments" --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)

          status_emoji="❌"
          status_text="FAILED"
          if [ "${{ steps.compat.outputs.exit_code }}" = "0" ]; then
            status_emoji="✅"
            status_text="PASSED"
          fi

          body_file=$(mktemp)
          {
            echo "$marker"
            echo "## Compat test: $status_emoji $status_text"
            echo ""
            echo "Ran \`node test/compat.mjs\` against \`dario proxy --passthrough\` on the [self-hosted runner](.github/workflows/compat-test-self-hosted.yml) for commit \`${{ github.event.pull_request.head.sha }}\`."
            echo ""
            echo "<details><summary>Output</summary>"
            echo ""
            echo '```'
            tail -80 compat-output.txt 2>/dev/null || echo "(no output captured)"
            echo '```'
            echo ""
            echo "</details>"
            echo ""
            echo "[Full workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } > "$body_file"

          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$existing" -f body="$(cat "$body_file")" > /dev/null
            echo "updated existing compat comment $existing"
          else
            gh pr comment "$pr" --body-file "$body_file"
            echo "posted new compat comment"
          fi

      - name: Set job status
        if: always()
        env:
          COMPAT_EXIT_CODE: ${{ steps.compat.outputs.exit_code }}
        run: |
          # The job's pass/fail is the compat suite's exit code, regardless
          # of whether the comment step succeeded.
          #
          # DEFAULTED, because `exit_code` is empty whenever the compat step
          # never ran — and it does not run when an EARLIER step fails, which
          # includes the maxTested gate refusing to validate a claim the runner
          # cannot back. In that case `exit ""` dies with
          #
          #   line 3: exit: : numeric argument required
          #
          # and the run surfaces a shell error (exit 2) instead of the real
          # verdict. Seen on #1046: the gate correctly refused a
          # maxTested=2.1.238 claim on a runner holding 2.1.237, and what a
          # reader saw was the shell message, not "compat cannot validate".
          #
          # Failing closed on 1 is the right default — reaching this step with
          # no recorded exit code means something upstream already failed, and
          # the only wrong answer here is a green run.
          exit "${COMPAT_EXIT_CODE:-1}"
