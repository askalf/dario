name: Drift PR heal (conflict + version collision)

# Reconciler for the ONE state the release automation creates and never exits.
#
# WHY THIS EXISTS. Every drafter computes its version bump off the package.json
# in its own checkout — master AT DRAFT TIME. So two drift PRs drafted before
# either merges claim the SAME version (#954/#955 both took 5.5.10 off 5.5.9),
# and a PR drafted before an unrelated release lands claims one that is already
# published (#1027 bumped 5.5.24 -> 5.5.25 with v5.5.25 already tagged).
#
# version-advances.sh catches that and refuses to arm the loser, which is
# right: merging it would either fast-exit cc-drift-auto-release's duplicate-
# tag guard green having shipped NOTHING, or move master's version backwards
# below a published tag. But refusing is where the automation stopped. Nothing
# renumbers the loser, so it sits open, drifts BEHIND as master moves, and
# waits for a human — and with required reviews on master the hand-fix pushes a
# commit, which dismisses any approval it had collected and returns it to the
# review queue. Each collision costs a full round trip, and on a busy drift
# cycle collisions arrive faster than round trips complete. That is the backlog.
#
# This closes it: update the branch, resolve the two-file conflict with the
# rule that already exists, renumber above the tip, and push. The PR then arms
# and releases through the normal path.
#
# SCOPE. Drift-bot branches only. It pushes to branches, so it must never be
# able to touch a human's PR, and the branch-prefix filter is the only thing
# standing between those two facts — keep it in step with auto-merge-sweep.yml.
#
# WAITS for Redline. A heal pushes a new head, and Redline drops a review
# whose head moved and a fix run pushes onto the branch it read. So a PR with
# a review, fix or verdict post queued or running at its head is skipped, and
# the next run heals it. Every open drift PR holds the version on its branch,
# skipped or not, so a renumber steps over all of them
# (scripts/drift-heal-plan.mjs).
#
# REFUSES rather than guesses. resolve-release-conflicts.mjs handles exactly
# the two-file shape our automation produces and exits 1 on anything else;
# renumber-release-version.mjs exits 1 when the CHANGELOG does not carry
# exactly one heading for the version being replaced. Either refusal leaves the
# PR untouched for a human, which is the state it was already in.

on:
  schedule:
    # 47 past the hour: clear of cc-drift-watch (:00), cc-drift-auto-release
    # (:15), auto-merge-sweep (:27) and cc-drift-template-watch (:41), so a
    # heal lands between a sweep and the next watcher rather than racing them.
    - cron: '47 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never two heals at once: both would compute the same floor from the same
  # tip and renumber two PRs onto the same version — the very collision this
  # workflow exists to clear.
  group: drift-pr-heal
  cancel-in-progress: false

jobs:
  heal:
    name: Heal stuck drift-bot PRs
    # Never from a fork. This pushes commits to branches and reads master's
    # published version to decide what to write; a fork inherits the schedule
    # but none of the context that makes either meaningful. See #1039.
    if: github.repository == 'askalf/dario'
    # On our runner, so this keeps PRs moving while GitHub's hosted queue is down. It checks out
    # each candidate branch and runs that branch's scripts, so the code it runs is the drift bots':
    # only same-owner branches named bot/cc-drift-, bot/template-label- or bot/template-rebake-
    # (the candidate filter below), never a fork's.
    runs-on: [self-hosted, dario-exec]
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
      # Redline's runs are listed with the job's own token, so the heal can wait for them.
      actions: read
    steps:
      - name: Check out with an identity whose pushes trigger CI
        uses: askalf/ci/actions/checkout-with-retry@12840236ea760c3fcc1b846abc1f852ab9e235b2 # main 2026-11-25, askalf/ci#244
        with:
          fetch-depth: 0
          # Load-bearing, not attribution garnish. A push made with
          # GITHUB_TOKEN does not fire `pull_request: synchronize`, by
          # GitHub's anti-loop design. Healing a PR with that token would
          # update the branch and leave it with no checks for the required
          # contexts — stuck in a new way, and harder to see than the old one.
          # The job refuses to run at all without the PAT, below.
          token: ${{ secrets.DARIO_DRIFT_BOT_PAT || secrets.GITHUB_TOKEN }}

      - name: Require the drift-bot PAT
        env:
          HAVE_PAT: ${{ secrets.DARIO_DRIFT_BOT_PAT != '' }}
        run: |
          set -euo pipefail
          if [ "$HAVE_PAT" != "true" ]; then
            echo "DARIO_DRIFT_BOT_PAT is not configured."
            echo "Healing a PR with GITHUB_TOKEN would push a commit that fires no"
            echo "pull_request event, leaving the PR with no runs for the required"
            echo "checks. Skipping is the safer failure: the PR stays exactly as it"
            echo "was, visibly stuck, rather than becoming invisibly stuck."
            echo "See docs/drift-monitor.md for PAT setup."
            exit 1
          fi

      - name: Heal
        env:
          GH_TOKEN: ${{ secrets.DARIO_DRIFT_BOT_PAT }}
          RUNS_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          git config user.name  "askalf"
          git config user.email "263217947+askalf@users.noreply.github.com"

          # Every open drift-bot PR, by the same prefix filter as auto-merge-sweep.yml.
          # Each one holds the version on its branch whatever its state (up to date,
          # a draft, waiting on Redline), so the renumber below steps over all of
          # them. A list that may be cut short could hide one, so it is refused.
          all=$(gh pr list --repo "$REPO" --state open --limit 1000 \
            --json number,isDraft,headRefName,headRefOid,baseRefName,headRepositoryOwner,mergeStateStatus)
          if [ "$(jq 'length' <<< "$all")" -ge 1000 ]; then
            echo "1000 or more open PRs: the list may be cut short, so no version plan is complete. Nothing healed."
            exit 1
          fi
          drift=$(jq -c --arg owner "${REPO%%/*}" '[.[]
                   | select(.headRepositoryOwner.login == $owner)
                   | select(.headRefName | startswith("bot/cc-drift-")
                            or startswith("bot/template-label-")
                            or startswith("bot/template-rebake-"))]' <<< "$all")
          # DIRTY = conflicting, BEHIND = base moved under a strict up-to-date
          # policy. Both are states no other job clears.
          candidates=$(jq -c '[.[]
                   | select(.isDraft == false)
                   | select(.mergeStateStatus == "DIRTY" or .mergeStateStatus == "BEHIND")]' <<< "$drift")

          count=$(printf '%s' "$candidates" | jq 'length')
          echo "Stuck drift-bot PRs: $count"
          # Explicit if, not `[ ] && { }`. Under `set -e` a false test at the
          # head of an AND-OR list makes the list return non-zero, which exits
          # the step — so the shorthand would abort precisely when there IS
          # work to do, and look like a clean no-op run.
          if [ "$count" -eq 0 ]; then
            echo "Nothing to do."
            exit 0
          fi

          # The plan's helpers, copied out before the loop: each candidate branch is
          # checked out in turn and may predate them.
          plan_dir="$RUNNER_TEMP/drift-heal-plan"
          mkdir -p "$plan_dir"
          cp scripts/drift-heal-plan.mjs scripts/_drift-patch-helpers.mjs "$plan_dir/"
          plan_js="$plan_dir/drift-heal-plan.mjs"

          # Redline's queued and running reviews, fixes and verdict posts as one JSON
          # list, or `null` when a list could not be read, which drift-heal-plan.mjs
          # counts as busy. The newest 100 runs of each workflow: one still queued or
          # running is among them. Read with the job's own token (actions: read).
          redline_runs() {
            local out='[]' wf page
            for wf in redline.yml redline-fix.yml redline-post.yml; do
              if ! page=$(GH_TOKEN="$RUNS_TOKEN" gh api "repos/$REPO/actions/workflows/$wf/runs?per_page=100" \
                          | jq -c --arg wf "$wf" '[.workflow_runs[] | select(.status != "completed")
                                | {workflow: $wf, id, event, status, display_title, head_sha}]'); then
                echo null
                return 0
              fi
              out=$(jq -c --argjson page "$page" '. + $page' <<< "$out")
            done
            echo "$out"
          }
          # Why Redline is at work on PR $1 at head $2, or nothing.
          redline_busy() {
            redline_runs > "$plan_dir/runs.json"
            node "$plan_js" busy "$REPO" "$1" "$2" "$plan_dir/runs.json"
          }

          # The version each open drift PR holds, read at the commit the list names.
          # A branch that cannot be fetched or read leaves the plan incomplete, and no
          # version is chosen from an incomplete plan: nothing is healed. A branch that
          # moved since the list is left for the next run, which lists it again.
          declare -A held=()
          declare -A planned=()
          for j in $(seq 0 $(( $(jq 'length' <<< "$drift") - 1 ))); do
            n=$(jq -r ".[$j].number" <<< "$drift")
            h=$(jq -r ".[$j].headRefName" <<< "$drift")
            oid=$(jq -r ".[$j].headRefOid" <<< "$drift")
            if ! git fetch -q origin "+refs/heads/$h:refs/remotes/origin/$h"; then
              echo "Plan incomplete: could not fetch $h (#$n). Nothing healed."
              exit 1
            fi
            if [ "$(git rev-parse "refs/remotes/origin/$h")" != "$oid" ]; then
              echo "Plan incomplete: $h (#$n) moved since the list was read. Nothing healed; the next run lists it again."
              exit 0
            fi
            v=$(git show "$oid:package.json" 2>/dev/null | jq -r '.version // ""' 2>/dev/null) || v=""
            if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Plan incomplete: $h (#$n) holds no x.y.z version at $oid. Nothing healed."
              exit 1
            fi
            held[$n]="$v"
            planned[$n]="$oid"
          done
          # The versions every open drift PR but #$1 holds, as a JSON list.
          held_by_others() {
            local k
            for k in "${!held[@]}"; do
              if [ "$k" != "$1" ]; then printf '%s\n' "${held[$k]}"; fi
            done | jq -R . | jq -sc .
          }

          healed=0
          refused=0
          skipped=0
          # Highest version claimed so far this run — see the renumber block.
          floor=""
          for i in $(seq 0 $((count - 1))); do
            pr=$(printf '%s' "$candidates"   | jq -r ".[$i].number")
            head=$(printf '%s' "$candidates" | jq -r ".[$i].headRefName")
            base=$(printf '%s' "$candidates" | jq -r ".[$i].baseRefName")
            echo "=== #$pr ($head onto $base) ==="

            git fetch origin "$head" "$base" --quiet
            git checkout -q -B "$head" "origin/$head"

            # The plan read this branch at the commit the list named. If it has moved
            # since, the version it holds may have too: record that one for the rest
            # of the run and leave the branch to the next run. If it cannot be read,
            # nothing more is healed, since no version can be chosen around it.
            if [ "$(git rev-parse HEAD)" != "${planned[$pr]}" ]; then
              v=$(jq -r '.version // ""' package.json 2>/dev/null) || v=""
              if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "  STOPPED: moved since the list was read and holds no x.y.z version; nothing more is healed this run"
                break
              fi
              held[$pr]="$v"
              echo "  SKIPPED: moved since the list was read; the next run heals it"
              skipped=$((skipped + 1))
              continue
            fi
            busy=$(redline_busy "$pr" "${planned[$pr]}")
            if [ -n "$busy" ]; then
              echo "  SKIPPED: Redline is at work on this head ($busy); the next run heals it"
              skipped=$((skipped + 1))
              continue
            fi

            # ── Renumber BEFORE merging. Order is load-bearing. ──────────────
            #
            # renumber-release-version.mjs reads the version to replace out of
            # package.json and renames the ONE CHANGELOG heading carrying it.
            # After a merge+resolve that version is no longer this PR's own:
            # resolve-release-conflicts.mjs keeps the HIGHER side, so a stale
            # bot PR ends up holding MASTER's version. Renumbering then renames
            # master's section — and on 2026-08-20 that meant relabelling the
            # notes of v5.5.31, already tagged and published, while the bot's
            # own entry sat orphaned further down the file. Merging that would
            # have shipped a release whose notes belong to a different one.
            #
            # Before the merge, package.json still holds the PR's own version,
            # so `before` is its own heading and master's sections are not even
            # in the tree yet. Same output in the ordinary case; correct in the
            # stale case.
            #
            # `floor` is the batch's running high-water mark, not just the base
            # tip: master does not move DURING a run, so every PR in one batch
            # computes the same tip and — before this — the same new version.
            # The first production run healed #1027 and #1028 onto 5.5.32 each,
            # reproducing the exact collision this workflow exists to clear.
            # The concurrency group prevents two RUNS colliding and does nothing
            # for two PRs inside one run; version-advances.sh cannot catch it
            # either, since it only ever compares against master.
            tip=$(git show "origin/$base:package.json" | jq -r '.version')
            if [ -n "$floor" ] \
               && [ "$(printf '%s\n%s\n' "$tip" "$floor" | sort -V | tail -1)" = "$floor" ] \
               && [ "$tip" != "$floor" ]; then
              effective_floor="$floor"
            else
              effective_floor="$tip"
            fi
            # The floor also steps over every version another open drift PR holds,
            # so the renumber never lands on one (drift-heal-plan.mjs floor).
            held_by_others "$pr" > "$plan_dir/held.json"
            pick=$(node "$plan_js" floor "$effective_floor" "${held[$pr]}" "$plan_dir/held.json")
            if [ "$pick" != "$effective_floor" ]; then
              echo "  floor raised from $effective_floor to $pick: another open drift PR holds the version above it"
            fi
            if ! node scripts/renumber-release-version.mjs "$pick"; then
              echo "  REFUSED — could not renumber safely; leaving for a human"
              git reset -q --hard "origin/$head"
              refused=$((refused + 1))
              continue
            fi
            # package-lock.json is in BOTH the test and the add: renumber now
            # mirrors the new version into the lockfile's two version slots, so
            # a renumber that changed only the lockfile must still commit.
            # Testing just the other two would leave that write uncommitted and
            # the lockfile would disagree with package.json — the exact drift
            # `npm run preflight` fails on.
            if ! git diff --quiet -- package.json package-lock.json CHANGELOG.md; then
              git add package.json package-lock.json CHANGELOG.md
              git commit -q -m "chore: renumber release above ${pick} (base moved under this PR)"
            fi

            # Conflicts are expected — that is the case being healed — so the
            # merge is allowed to fail and the resolver decides.
            if ! git merge "origin/$base" --no-edit >/dev/null 2>&1; then
              # The resolver only ever touches the three files that carry the
              # version: package.json, package-lock.json and CHANGELOG.md.
              # A drift PR CAN also conflict in source — observed on #1038,
              # where #1037 had added utilFreshness to the same pool import
              # line this PR was adding accountIneligibility to. Resolving the
              # two version files and committing would fail on the still-
              # unmerged source path and, under `set -e`, take the whole job
              # down with every later PR unprocessed. Check the unmerged set
              # FIRST and skip cleanly when it is not ours to resolve.
              # Name the paths that are NOT ours rather than pattern-matching a
              # joined list: that spelling depends on sort order and on exactly
              # how the separator lands, and the first draft of it refused
              # everything because `tr` left a trailing space.
              outside=$(git diff --name-only --diff-filter=U \
                        | grep -vxE 'package\.json|package-lock\.json|CHANGELOG\.md' || true)
              if [ -n "$outside" ]; then
                echo "  REFUSED — conflicts outside the version files:"
                # read-loop rather than `sed 's/^/    /'`: shellcheck SC2001
                # rejects the sed form, and actionlint runs shellcheck as a
                # required check.
                echo "$outside" | while IFS= read -r p; do echo "    $p"; done
                git merge --abort || true
                refused=$((refused + 1))
                continue
              fi
              if ! node scripts/resolve-release-conflicts.mjs; then
                echo "  REFUSED — conflict is not the shape the resolver handles; leaving for a human"
                git merge --abort || true
                refused=$((refused + 1))
                continue
              fi
              git add package.json package-lock.json CHANGELOG.md
              # Belt and braces: if anything is still unmerged the commit would
              # fail and `set -e` would end the job, so verify before running it.
              if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
                echo "  REFUSED — unmerged paths remain after resolve; leaving for a human"
                git merge --abort || true
                refused=$((refused + 1))
                continue
              fi
              git commit -q --no-edit
            fi

            # Master may have brought notes under `## [Unreleased]`: a
            # contribution merged after this PR was drafted, which the resolver
            # keeps on top by design. This PR's release ships that code, so its
            # notes move into this release's section (check-changelog.mjs fails
            # the PR otherwise; 6.8.7 and 6.10.3 shipped with them stranded).
            if node scripts/fold-unreleased.mjs && ! git diff --quiet -- CHANGELOG.md; then
              git add CHANGELOG.md
              git commit -q -m "chore: fold notes merged since drafting into this release"
            fi

            # Final gate: ask the SAME question the arming path asks, so this
            # job can never hand the sweep something the sweep will refuse.
            # Note this compares against MASTER only — it is structurally unable
            # to see a sibling in the same batch, which is why the running
            # `floor` above exists rather than relying on this to catch it.
            base_ver=$(git show "origin/$base:package.json" | jq -r '.version')
            head_ver=$(jq -r '.version' package.json)
            verdict=$(sh scripts/version-advances.sh "$base_ver" "$head_ver" "$base_ver")
            if [ "$(echo "$verdict" | head -1)" != "true" ]; then
              echo "  REFUSED — $(echo "$verdict" | tail -1)"
              git reset -q --hard "origin/$head"
              refused=$((refused + 1))
              continue
            fi
            # And no other open drift PR holds it. The floor above is chosen so that
            # none does; this keeps a resolver or fold that changed the version from
            # handing the sweep two PRs with one release number.
            taken=""
            for k in "${!held[@]}"; do
              if [ "$k" != "$pr" ] && [ "${held[$k]}" = "$head_ver" ]; then taken="$k"; fi
            done
            if [ -n "$taken" ]; then
              echo "  REFUSED: #$taken already holds $head_ver"
              git reset -q --hard "origin/$head"
              refused=$((refused + 1))
              continue
            fi

            if git diff --quiet "origin/$head" HEAD; then
              echo "  nothing to push (already current)"
              # Still claim the version: an untouched PR already holding this
              # number must not have it handed to the next PR in the batch.
              floor="$head_ver"
              continue
            fi
            # Redline may have started on this head while it was healed here: check
            # again just before the push, and leave the branch as it was if so.
            busy=$(redline_busy "$pr" "${planned[$pr]}")
            if [ -n "$busy" ]; then
              echo "  SKIPPED: Redline started on this head while it was healed ($busy); the next run heals it"
              git reset -q --hard "origin/$head"
              skipped=$((skipped + 1))
              continue
            fi
            # A branch that is still the drafter's one commit is flattened onto the base as one commit
            # with that commit's subject. Any other branch keeps its commits and gets the merge as it
            # stands: the commits pushed on top of a draft (a fix for a review, or a merge of the base
            # someone resolved by hand) are what its comments and verdicts name, and a template
            # rebake's bake commit carries the rebake/upstream status the merge gate looks for among
            # the PR's commits, which a new commit would not carry. Every commit in the fetched range
            # counts, merges included, so the sole commit must be a non-merge draft.
            # The lease rejects the push if the remote tip is not the one fetched above.
            own=$(git rev-list --count "origin/$base..origin/$head")
            merges=$(git rev-list --merges --count "origin/$base..origin/$head")
            if [ "$own" -eq 1 ] && [ "$merges" -eq 0 ] && [[ "$head" != bot/template-rebake-* ]]; then
              subject=$(git log --reverse --no-merges --format=%s "origin/$base..origin/$head" | head -n 1)
              git reset -q --soft "origin/$base"
              git commit -q -m "$subject"
            else
              echo "  history kept: $own commits of its own ($merges merges), or a template rebake"
            fi
            git push --force-with-lease="$head:$(git rev-parse "origin/$head")" origin "HEAD:$head"
            echo "  HEALED — $(echo "$verdict" | tail -1)"
            # Claim it for the rest of this run.
            floor="$head_ver"
            held[$pr]="$head_ver"
            healed=$((healed + 1))
          done

          echo "healed=$healed refused=$refused skipped=$skipped"
