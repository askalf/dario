name: Drift PR heal (conflict + version collision)

# Reconciler for the ONE state the release automation creates and never exits.
#
# WHY THIS EXISTS. Every drafter computes its version bump off the package.json
# in its own checkout — master AT DRAFT TIME. So two drift PRs drafted before
# either merges claim the SAME version (#954/#955 both took 5.5.10 off 5.5.9),
# and a PR drafted before an unrelated release lands claims one that is already
# published (#1027 bumped 5.5.24 -> 5.5.25 with v5.5.25 already tagged).
#
# version-advances.sh catches that and refuses to arm the loser, which is
# right: merging it would either fast-exit cc-drift-auto-release's duplicate-
# tag guard green having shipped NOTHING, or move master's version backwards
# below a published tag. But refusing is where the automation stopped. Nothing
# renumbers the loser, so it sits open, drifts BEHIND as master moves, and
# waits for a human — and with required reviews on master the hand-fix pushes a
# commit, which dismisses any approval it had collected and returns it to the
# review queue. Each collision costs a full round trip, and on a busy drift
# cycle collisions arrive faster than round trips complete. That is the backlog.
#
# This closes it: update the branch, resolve the two-file conflict with the
# rule that already exists, renumber above the tip, and push. The PR then arms
# and releases through the normal path.
#
# SCOPE. Drift-bot branches only. It pushes to branches, so it must never be
# able to touch a human's PR, and the branch-prefix filter is the only thing
# standing between those two facts — keep it in step with auto-merge-sweep.yml.
#
# REFUSES rather than guesses. resolve-release-conflicts.mjs handles exactly
# the two-file shape our automation produces and exits 1 on anything else;
# renumber-release-version.mjs exits 1 when the CHANGELOG does not carry
# exactly one heading for the version being replaced. Either refusal leaves the
# PR untouched for a human, which is the state it was already in.

on:
  schedule:
    # 47 past the hour: clear of cc-drift-watch (:00), cc-drift-auto-release
    # (:15), auto-merge-sweep (:27) and cc-drift-template-watch (:41), so a
    # heal lands between a sweep and the next watcher rather than racing them.
    - cron: '47 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never two heals at once: both would compute the same floor from the same
  # tip and renumber two PRs onto the same version — the very collision this
  # workflow exists to clear.
  group: drift-pr-heal
  cancel-in-progress: false

jobs:
  heal:
    name: Heal stuck drift-bot PRs
    # Never from a fork. This pushes commits to branches and reads master's
    # published version to decide what to write; a fork inherits the schedule
    # but none of the context that makes either meaningful. See #1039.
    if: github.repository == 'askalf/dario'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out with an identity whose pushes trigger CI
        uses: askalf/checkout-with-retry@115a6407547e9711edbc2e915838d495cad9583f  # v1.1.0
        with:
          fetch-depth: 0
          # Load-bearing, not attribution garnish. A push made with
          # GITHUB_TOKEN does not fire `pull_request: synchronize`, by
          # GitHub's anti-loop design. Healing a PR with that token would
          # update the branch and leave it with no checks for the required
          # contexts — stuck in a new way, and harder to see than the old one.
          # The job refuses to run at all without the PAT, below.
          token: ${{ secrets.DARIO_DRIFT_BOT_PAT || secrets.GITHUB_TOKEN }}

      - name: Require the drift-bot PAT
        env:
          HAVE_PAT: ${{ secrets.DARIO_DRIFT_BOT_PAT != '' }}
        run: |
          set -euo pipefail
          if [ "$HAVE_PAT" != "true" ]; then
            echo "DARIO_DRIFT_BOT_PAT is not configured."
            echo "Healing a PR with GITHUB_TOKEN would push a commit that fires no"
            echo "pull_request event, leaving the PR with no runs for the required"
            echo "checks. Skipping is the safer failure: the PR stays exactly as it"
            echo "was, visibly stuck, rather than becoming invisibly stuck."
            echo "See docs/drift-monitor.md for PAT setup."
            exit 1
          fi

      - name: Heal
        env:
          GH_TOKEN: ${{ secrets.DARIO_DRIFT_BOT_PAT }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          git config user.name  "askalf"
          git config user.email "263217947+askalf@users.noreply.github.com"

          # Same prefix filter as auto-merge-sweep.yml. DIRTY = conflicting,
          # BEHIND = base moved under a strict up-to-date policy. Both are
          # states no other job clears.
          candidates=$(gh pr list --repo "$REPO" --state open --limit 50 \
            --json number,isDraft,headRefName,baseRefName,headRepositoryOwner,mergeStateStatus \
            --jq '[.[]
                   | select(.isDraft == false)
                   | select(.headRepositoryOwner.login == "'"${REPO%%/*}"'")
                   | select(.mergeStateStatus == "DIRTY" or .mergeStateStatus == "BEHIND")
                   | select(.headRefName | startswith("bot/cc-drift-")
                            or startswith("bot/template-label-")
                            or startswith("bot/template-rebake-"))]')

          count=$(printf '%s' "$candidates" | jq 'length')
          echo "Stuck drift-bot PRs: $count"
          # Explicit if, not `[ ] && { }`. Under `set -e` a false test at the
          # head of an AND-OR list makes the list return non-zero, which exits
          # the step — so the shorthand would abort precisely when there IS
          # work to do, and look like a clean no-op run.
          if [ "$count" -eq 0 ]; then
            echo "Nothing to do."
            exit 0
          fi

          healed=0
          refused=0
          # Highest version claimed so far this run — see the renumber block.
          floor=""
          for i in $(seq 0 $((count - 1))); do
            pr=$(printf '%s' "$candidates"   | jq -r ".[$i].number")
            head=$(printf '%s' "$candidates" | jq -r ".[$i].headRefName")
            base=$(printf '%s' "$candidates" | jq -r ".[$i].baseRefName")
            echo "=== #$pr ($head onto $base) ==="

            git fetch origin "$head" "$base" --quiet
            git checkout -q -B "$head" "origin/$head"

            # ── Renumber BEFORE merging. Order is load-bearing. ──────────────
            #
            # renumber-release-version.mjs reads the version to replace out of
            # package.json and renames the ONE CHANGELOG heading carrying it.
            # After a merge+resolve that version is no longer this PR's own:
            # resolve-release-conflicts.mjs keeps the HIGHER side, so a stale
            # bot PR ends up holding MASTER's version. Renumbering then renames
            # master's section — and on 2026-08-20 that meant relabelling the
            # notes of v5.5.31, already tagged and published, while the bot's
            # own entry sat orphaned further down the file. Merging that would
            # have shipped a release whose notes belong to a different one.
            #
            # Before the merge, package.json still holds the PR's own version,
            # so `before` is its own heading and master's sections are not even
            # in the tree yet. Same output in the ordinary case; correct in the
            # stale case.
            #
            # `floor` is the batch's running high-water mark, not just the base
            # tip: master does not move DURING a run, so every PR in one batch
            # computes the same tip and — before this — the same new version.
            # The first production run healed #1027 and #1028 onto 5.5.32 each,
            # reproducing the exact collision this workflow exists to clear.
            # The concurrency group prevents two RUNS colliding and does nothing
            # for two PRs inside one run; version-advances.sh cannot catch it
            # either, since it only ever compares against master.
            tip=$(git show "origin/$base:package.json" | jq -r '.version')
            if [ -n "$floor" ] \
               && [ "$(printf '%s\n%s\n' "$tip" "$floor" | sort -V | tail -1)" = "$floor" ] \
               && [ "$tip" != "$floor" ]; then
              effective_floor="$floor"
            else
              effective_floor="$tip"
            fi
            if ! node scripts/renumber-release-version.mjs "$effective_floor"; then
              echo "  REFUSED — could not renumber safely; leaving for a human"
              git reset -q --hard "origin/$head"
              refused=$((refused + 1))
              continue
            fi
            if ! git diff --quiet -- package.json CHANGELOG.md; then
              git add package.json CHANGELOG.md
              git commit -q -m "chore: renumber release above ${effective_floor} (base moved under this PR)"
            fi

            # Conflicts are expected — that is the case being healed — so the
            # merge is allowed to fail and the resolver decides.
            if ! git merge "origin/$base" --no-edit >/dev/null 2>&1; then
              # The resolver only ever touches package.json and CHANGELOG.md.
              # A drift PR CAN also conflict in source — observed on #1038,
              # where #1037 had added utilFreshness to the same pool import
              # line this PR was adding accountIneligibility to. Resolving the
              # two version files and committing would fail on the still-
              # unmerged source path and, under `set -e`, take the whole job
              # down with every later PR unprocessed. Check the unmerged set
              # FIRST and skip cleanly when it is not ours to resolve.
              # Name the paths that are NOT ours rather than pattern-matching a
              # joined list: that spelling depends on sort order and on exactly
              # how the separator lands, and the first draft of it refused
              # everything because `tr` left a trailing space.
              outside=$(git diff --name-only --diff-filter=U \
                        | grep -vxE 'package\.json|CHANGELOG\.md' || true)
              if [ -n "$outside" ]; then
                echo "  REFUSED — conflicts outside the version files:"
                # read-loop rather than `sed 's/^/    /'`: shellcheck SC2001
                # rejects the sed form, and actionlint runs shellcheck as a
                # required check.
                echo "$outside" | while IFS= read -r p; do echo "    $p"; done
                git merge --abort || true
                refused=$((refused + 1))
                continue
              fi
              if ! node scripts/resolve-release-conflicts.mjs; then
                echo "  REFUSED — conflict is not the shape the resolver handles; leaving for a human"
                git merge --abort || true
                refused=$((refused + 1))
                continue
              fi
              git add package.json CHANGELOG.md
              # Belt and braces: if anything is still unmerged the commit would
              # fail and `set -e` would end the job, so verify before running it.
              if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
                echo "  REFUSED — unmerged paths remain after resolve; leaving for a human"
                git merge --abort || true
                refused=$((refused + 1))
                continue
              fi
              git commit -q --no-edit
            fi

            # Final gate: ask the SAME question the arming path asks, so this
            # job can never hand the sweep something the sweep will refuse.
            # Note this compares against MASTER only — it is structurally unable
            # to see a sibling in the same batch, which is why the running
            # `floor` above exists rather than relying on this to catch it.
            base_ver=$(git show "origin/$base:package.json" | jq -r '.version')
            head_ver=$(jq -r '.version' package.json)
            verdict=$(sh scripts/version-advances.sh "$base_ver" "$head_ver" "$base_ver")
            if [ "$(echo "$verdict" | head -1)" != "true" ]; then
              echo "  REFUSED — $(echo "$verdict" | tail -1)"
              git reset -q --hard "origin/$head"
              refused=$((refused + 1))
              continue
            fi

            if git diff --quiet "origin/$head" HEAD; then
              echo "  nothing to push (already current)"
              # Still claim the version: an untouched PR already holding this
              # number must not have it handed to the next PR in the batch.
              floor="$head_ver"
              continue
            fi
            git push origin "HEAD:$head"
            echo "  HEALED — $(echo "$verdict" | tail -1)"
            # Claim it for the rest of this run.
            floor="$head_ver"
            healed=$((healed + 1))
          done

          echo "healed=$healed refused=$refused"
