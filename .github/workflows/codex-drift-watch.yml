name: Codex drift watch

# Inert until the operator sets DARIO_CODEX_LIVE_HOME in this self-hosted
# runner's repository variables. It must name a HOME containing
# .dario/codex-accounts; no credential is committed or copied.
#
# Baseline. test/fixtures/codex-models.snapshot.json is the account-visible model
# list as dario's own client version sees it: the backend answers /models per
# client_version (dario#1360), so the probe reads CODEX_CLIENT_VERSION from the
# build it just made instead of pinning its own.
#
# Two probes, two outcomes:
#   - The model list differs from the snapshot: this workflow opens (or
#     refreshes) a bot/codex-models-* PR carrying the live list, with the diff in
#     its body. The PR takes the normal review and merge path, and the first
#     green run after it lands closes any open drift issue. No hand copy. A list
#     that fetches and matches the snapshot again closes that PR unmerged; a
#     failed or rate-limited fetch leaves it alone.
#   - The wire contract fails, or the list cannot be fetched: an issue, because
#     a person has to look.
# A snapshot that ships empty makes the first enabled run open the seed PR.
on:
  schedule:
    - cron: '29 5 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: codex-drift-watch
  cancel-in-progress: false

jobs:
  codex-drift-check:
    permissions:
      contents: write       # push the snapshot commit to bot/codex-models-* branches
      issues: write
      pull-requests: write  # open the snapshot PR
    # Schedule/dispatch only. The repository guard keeps inherited forks from
    # executing code on a runner with a real subscription account.
    if: github.repository == 'askalf/dario' && vars.DARIO_CODEX_LIVE_HOME != ''
    runs-on: [self-hosted, dario-drift]
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DARIO_CODEX_LIVE_HOME: ${{ vars.DARIO_CODEX_LIVE_HOME }}
    steps:
      - uses: askalf/checkout-with-retry@115a6407547e9711edbc2e915838d495cad9583f  # v1.1.0
        with:
          # master, whatever ref a dispatch names. The snapshot compared below is the baseline the PR steps
          # act on: a run dispatched on a bot/codex-models-* branch would otherwise compare the live list to
          # that PR's own copy, read it as a match, and close a PR master still needs. New snapshot branches
          # are cut from this checkout too, so they always start from master.
          ref: master
          # The report step below pushes the snapshot branch with the same PAT it opens the PR with: a
          # push or PR made with GITHUB_TOKEN fires no pull_request workflows, so a snapshot PR head would
          # carry no checks. The checkout keeps it too, so a hand-run step in this job pushes the same way.
          token: ${{ secrets.DARIO_DRIFT_BOT_PAT || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
      - name: Build
        run: npm ci --no-audit --no-fund && npm run build
      - name: Run Codex wire contract and model snapshot checks
        id: check
        run: |
          set +e
          # A parked account leaves a dangling symlink; only a readable regular file counts, else the run is skipped (exit 2), not drift.
          account_file=$(find -L "$DARIO_CODEX_LIVE_HOME/.dario/codex-accounts" -name '*.json' -type f -readable -print -quit 2>/dev/null)
          if [ -z "$account_file" ]; then
            echo '::warning::Configured Codex HOME has no account file; skipping.'
            echo 'exit_code=2' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          export account_file
          account_id=$(node -e "const a=JSON.parse(require('fs').readFileSync(process.argv[1]));const p=String(a.idToken||'').split('.')[1];try{console.log(JSON.parse(Buffer.from(p||'','base64url').toString())['https://api.openai.com/auth']?.chatgpt_account_id||'')}catch{}" "$account_file")
          [ -z "$account_id" ] || echo "::add-mask::$account_id"
          port=$((40000 + RANDOM % 20000)); export HOME="$DARIO_CODEX_LIVE_HOME"
          node dist/cli.js proxy --no-claude-auth --port="$port" > proxy.log 2>&1 & pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=false; for _ in $(seq 1 30); do curl -sf "http://127.0.0.1:$port/health" >/dev/null && { ready=true; break; }; sleep 1; done
          if [ "$ready" != true ]; then echo '::error::Codex proxy did not become healthy'; echo '--- proxy.log ---'; cat proxy.log; echo '--- /health ---'; curl -s "http://127.0.0.1:$port/health" || true; echo; echo 'exit_code=1' >> "$GITHUB_OUTPUT"; echo 'issue=1' >> "$GITHUB_OUTPUT"; exit 0; fi
          DARIO_URL="http://127.0.0.1:$port" DARIO_API_KEY=dario node test/manual/codex-wire-contract.mjs 2>&1 | tee contract.log; contract=${PIPESTATUS[0]}
          # A probe the upstream refused with a 429 proves nothing about the wire: the fleet seat was over
          # its window (2026-09-16 10:05Z, run 35083025995 filed "drift" on a rate-limited seat). Report it
          # as inconclusive (exit 3): no drift issue is opened, and no recovery close fires either.
          if [ "$contract" -ne 0 ] && grep -qE "returned 429|status\":429" contract.log; then echo "::warning::Codex wire probe was rate-limited (429) — inconclusive, not drift"; contract=3; fi
          # The backend gates /models per client_version, so the list is fetched as the CODEX_CLIENT_VERSION
          # the build above exports: the probe sees what dario sees.
          client_version=$(node --input-type=module -e "const m = await import(process.cwd() + '/dist/codex-backend.js'); console.log(m.CODEX_CLIENT_VERSION)")
          echo "client_version=$client_version" >> "$GITHUB_OUTPUT"
          export client_version
          node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync(process.env.account_file));const p=String(a.idToken||'').split('.')[1];const h={Authorization:'Bearer '+a.accessToken,Accept:'application/json',originator:'codex_cli_rs','OpenAI-Beta':'responses=experimental'};try{const id=JSON.parse(Buffer.from(p||'','base64url').toString())['https://api.openai.com/auth']?.chatgpt_account_id;if(id)h['ChatGPT-Account-ID']=id}catch{}fetch('https://chatgpt.com/backend-api/codex/models?client_version='+encodeURIComponent(process.env.client_version),{headers:h}).then(async r=>{if(!r.ok)throw Error('models '+r.status);const j=await r.json();const models=(j.models||j.data||[]).map(m=>({slug:m.slug||m.id,visibility:m.visibility||null})).filter(m=>m.slug).sort((a,b)=>a.slug.localeCompare(b.slug));fs.writeFileSync('live-models.json',JSON.stringify({models},null,2)+'\\n')}).catch(e=>{console.error(e);process.exit(1)})" 2>models.err; fetch_models=$?
          # The model list is its own probe. A fetch the upstream rate-limited is inconclusive (3) for the same
          # reason the wire probe is; any other fetch failure, or a list that differs from the snapshot, is drift.
          if [ "$fetch_models" -eq 0 ]; then cmp -s test/fixtures/codex-models.snapshot.json live-models.json; models=$?; elif grep -q "models 429" models.err; then echo "::warning::Codex model list fetch was rate-limited (429) — inconclusive, not drift"; models=3; else cat models.err; models=1; fi
          # Two independent probes, one verdict. A real finding on either axis is drift and must be reported even
          # when the other axis was rate-limited; only when neither found anything and at least one could not
          # look is the run inconclusive. (Review on the first cut: a 429 on the wire probe must not hide a model
          # list that fetched fine and differs.)
          # The account can be parked while the probes run, and a probe without an account fails whatever the
          # wire looks like. An account file that is no longer a readable regular file makes the run a skip
          # (exit 2), the same as having none at the start.
          if [ ! -f "$account_file" ] || [ ! -r "$account_file" ]; then
            echo '::warning::Codex account file disappeared during the run (parked?); skipping, not drift.'
            echo 'exit_code=2' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          drift=0; inconclusive=0; issue=0; snapshot_drift=0; snapshot_match=0
          # A wire failure or an unfetchable list needs a person: issue. A list that fetched and differs
          # from the snapshot needs a commit: PR. Both can be true in one run, and then both happen.
          # A list that fetched and equals the snapshot makes any open snapshot PR obsolete, whatever the
          # wire probe found.
          if [ "$contract" -eq 3 ]; then inconclusive=1; elif [ "$contract" -ne 0 ]; then drift=1; issue=1; fi
          if [ "$models" -eq 3 ]; then inconclusive=1; elif [ "$models" -ne 0 ]; then drift=1; if [ "$fetch_models" -eq 0 ]; then snapshot_drift=1; else issue=1; fi; fi
          if [ "$fetch_models" -eq 0 ] && [ "$models" -eq 0 ]; then snapshot_match=1; fi
          {
            echo "issue=$issue"
            echo "snapshot_drift=$snapshot_drift"
            echo "snapshot_match=$snapshot_match"
          } >> "$GITHUB_OUTPUT"
          if [ "$drift" -eq 1 ]; then echo 'exit_code=1' >> "$GITHUB_OUTPUT"; elif [ "$inconclusive" -eq 1 ]; then echo 'exit_code=3' >> "$GITHUB_OUTPUT"; else echo 'exit_code=0' >> "$GITHUB_OUTPUT"; fi
      # The list a reviewer compares the snapshot PR against, from the same run.
      - name: Publish live model snapshot to the job summary
        if: always() && hashFiles('live-models.json') != ''
        run: |
          {
            cat <<'HEADER'
          ### Account-visible Codex models

          Fetched as dario's client version (`CODEX_CLIENT_VERSION`). When it differs from `test/fixtures/codex-models.snapshot.json`, the snapshot PR step below carries it.

          ```json
          HEADER
            cat live-models.json
            cat <<'FOOTER'
          ```
          FOOTER
          } >> "$GITHUB_STEP_SUMMARY"
          echo '--- live-models.json ---'
          cat live-models.json
      - name: Upload live model snapshot
        if: always() && hashFiles('live-models.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: codex-live-models-${{ github.run_id }}
          path: live-models.json
          retention-days: 7
      # What the report step carries: the live list in the snapshot's place, and the two bodies. The
      # diff is the report step's to add to the PR body.
      - name: Write the reports
        if: ${{ !cancelled() && (steps.check.outputs.snapshot_drift == '1' || steps.check.outputs.issue == '1') }}
        env:
          SNAPSHOT_DRIFT: ${{ steps.check.outputs.snapshot_drift }}
          ISSUE: ${{ steps.check.outputs.issue }}
          CLIENT_VERSION: ${{ steps.check.outputs.client_version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eo pipefail
          if [ "$SNAPSHOT_DRIFT" = 1 ]; then
            cp live-models.json test/fixtures/codex-models.snapshot.json
            {
              echo "## Codex model snapshot"
              echo ""
              echo "The ChatGPT backend's account-visible model list differs from \`test/fixtures/codex-models.snapshot.json\` on [run #$GITHUB_RUN_ID]($RUN_URL), fetched as client version \`$CLIENT_VERSION\` (the one dario sends). This PR makes the snapshot the live list; nothing else changes."
              echo ""
              echo "dario routes only models with visibility \`list\`, so a slug that leaves that set here is one the Codex pool no longer serves. If anything in dario still names it (pricing in src/analytics.ts, a fallback tier, a doc), that is a follow-up; this PR records the fact."
            } > pr-body.md
          fi
          if [ "$ISSUE" = 1 ]; then
            echo "Codex wire-contract validation failed, the proxy did not come up, or the account-visible model list could not be fetched. See [run #$GITHUB_RUN_ID]($RUN_URL); when the list was fetched it is in that run's job summary and in the codex-live-models-$GITHUB_RUN_ID artifact. A list that merely differs from the snapshot opens a bot/codex-models-* PR instead of this issue." > issue-body.md
          fi
      # One snapshot PR at a time under bot/codex-models-, refreshed while open; the drift issue, opened
      # once and refreshed with a comment; both closed or settled on a clean run. The PR and its push use
      # the PAT so pull_request workflows run on it; the issue uses the job token (issues: write), which a
      # PAT without Issues rights cannot replace (dario#1579).
      - name: Report
        if: ${{ !cancelled() && steps.check.outputs.exit_code != '2' && steps.check.outputs.exit_code != '3' }}
        uses: askalf/ci/actions/drift-report@db7bc038315e4dec6f290fcab2aa802db64f8d73 # main 2026-10-11, askalf/ci#44
        with:
          label: codex-drift
          label-description: Codex wire or model-list drift
          issue: ${{ steps.check.outputs.issue == '1' }}
          issue-title: Codex drift detected
          issue-body-file: issue-body.md
          pr: ${{ steps.check.outputs.snapshot_drift == '1' }}
          pr-branch-prefix: bot/codex-models-
          pr-files: test/fixtures/codex-models.snapshot.json
          pr-title: "test(codex): model snapshot follows the account's list"
          pr-body-file: pr-body.md
          pr-base: master
          author-name: codex-drift-watch[bot]
          close: ${{ steps.check.outputs.exit_code == '0' }}
          close-comment: "Auto-closed: Codex wire contract and model snapshot match on [run #${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          token: ${{ secrets.DARIO_DRIFT_BOT_PAT || github.token }}
      - name: Close obsolete Codex model snapshot PR
        # The list fetched and is back on the committed snapshot, so an open snapshot PR carries a list the
        # account no longer shows and must not merge. Only a fetched, matching list closes it: a failed or
        # rate-limited fetch says nothing about the list, and the PR stays.
        if: ${{ !cancelled() && steps.check.outputs.snapshot_match == '1' }}
        # Closing a PR triggers nothing downstream, so the job token (pull-requests: write) does it; the
        # PAT is only for the push and the PR creation that must start CI.
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eo pipefail
          # Same match as the step that opens them: our branch prefix, in this repository.
          for n in $(gh pr list -R "$GITHUB_REPOSITORY" --state open --search "head:bot/codex-models-" --json number,headRefName,isCrossRepository --jq '.[] | select((.isCrossRepository | not) and (.headRefName | startswith("bot/codex-models-"))) | .number'); do
            gh pr close "$n" -R "$GITHUB_REPOSITORY" --delete-branch --comment "Closed unmerged: the account's model list matches the committed snapshot again on [run #$GITHUB_RUN_ID]($RUN_URL), so this PR no longer reflects the live list. A later change opens a new one."
          done
